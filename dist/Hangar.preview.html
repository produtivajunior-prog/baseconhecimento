document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Falha de carregamento de recurso (imagem, iframe, fonte) chega aqui sem `message`; não é erro do app.
    if (!e || !e.message) return;
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

g3{grid-template-columns:1fr 1fr!important}\n    }\n    @media (max-width:680px){\n      .hg-main{padding-left:16px!important;padding-right:16px!important}\n      .hg-header{padding:0 16px!important;gap:12px!important}\n      .hg-hero{padding:44px 16px 40px!important}\n      .hg-hero h1{font-size:34px!important}\n      .hg-hero p{font-size:16px!important}\n      .hg-g2,.hg-g3,.hg-form{grid-template-columns:1fr!important}\n      .hg-hide-m{display:none!important}\n      .hg-only-m{display:flex!important}\n      .hg-filtros{display:none!important}\n      .hg-filtros.hg-open{display:block!important}\n      .hg-stack{flex-direction:column!important;align-items:stretch!important}\n      .hg-stack-l{flex-direction:column!important;align-items:flex-start!important;gap:6px}\n      .hg-wrap{flex-wrap:wrap!important}\n      .hg-header{flex-wrap:wrap;height:auto!important;padding:10px 16px!important;row-gap:6px}\n      .hg-nav{order:3;width:100%;margin-left:0!important;padding-bottom:2px}\n      .hg-capa{height:220px!important}\n    }\n    .hg-cols>*,.hg-g2>*,.hg-g3>*{min-width:0}\n    @keyframes ciepGrow{from{height:0;opacity:0}to{opacity:1}}\n    @keyframes ciepSpin{to{transform:rotate(360deg)}}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'Figtree',sans-serif;color:#172A30;background:#F6F9FA;min-height:100vh;-webkit-font-smoothing:antialiased\">\n\n  <!-- ============ TOP NAV ============ -->\n  <header style=\"position:sticky;top:0;z-index:30;background:rgba(255,255,255,0.88);backdrop-filter:blur(10px);border-bottom:1px solid #E7EEF1\">\n    <div class=\"hg-header\" style=\"max-width:1200px;margin:0 auto;padding:0 28px;height:68px;display:flex;align-items:center;gap:28px\">\n      <div onclick=\"{{ goHome }}\" style=\"display:flex;align-items:center;gap:11px;cursor:pointer;flex:none\">\n        <img src=\"3ef4b086-390f-48b4-b543-ba27789b2a30\" alt=\"Produtiva Júnior\" style=\"height:30px;width:auto;display:block\">\n        <div style=\"display:flex;flex-direction:column;line-height:1.05\">\n          <span style=\"font-family:'Schibsted Grotesk';font-weight:700;font-size:16px;color:#163B45;letter-spacing:-0.01em\">Hangar<\u002Fspan>\n          <span style=\"font-size:11px;color:#8AA0A7;font-weight:500;letter-spacing:0.04em\">PRODUTIVA JÚNIOR<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <nav class=\"hg-nav\" style=\"display:flex;align-items:center;gap:4px;margin-left:6px;min-width:0\">\n        <sc-for list=\"{{ navItems }}\" as=\"n\" hint-placeholder-count=\"6\">\n          <button onclick=\"{{ n.go }}\" style=\"border:none;background:{{ n.bg }};color:{{ n.color }};font-size:14.5px;font-weight:{{ n.weight }};padding:8px 14px;border-radius:9px;cursor:pointer\">{{ n.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <button onclick=\"{{ goRecomendar }}\" style=\"display:flex;align-items:center;gap:7px;border:1px solid #CDE6EC;background:#EAF6F9;color:#1E7C92;font-size:14px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer\" style-hover=\"background:#DCF0F4\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"#1E7C92\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n        <span class=\"hg-hide-m\">Recomendar<\u002Fspan>\n      <\u002Fbutton>\n      <sc-if value=\"{{ hasEu }}\" hint-placeholder-val=\"{{ false }}\"><div title=\"{{ euNome }}\" style=\"width:34px;height:34px;border-radius:50%;background:#163B45;color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none\">{{ euIniciais }}<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ HOME ============ -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <main>\n    <section style=\"background:linear-gradient(180deg,#fff 0%,#F6F9FA 100%);border-bottom:1px solid #EBF1F3\">\n      <div class=\"hg-hero\" style=\"max-width:920px;margin:0 auto;padding:74px 28px 64px;text-align:center\">\n        <div style=\"display:inline-flex;align-items:center;gap:8px;background:#EAF6F9;color:#1E7C92;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:100px;margin-bottom:22px;letter-spacing:0.02em\">\n          <span style=\"width:6px;height:6px;border-radius:50%;background:#3DAFC7\"><\u002Fspan>\n          Ferramentas, escopos e cases da Produtiva\n        <\u002Fdiv>\n        <h1 style=\"font-size:46px;line-height:1.08;font-weight:700;color:#163B45;letter-spacing:-0.025em;max-width:780px;margin:0 auto;text-wrap:balance\">Tudo que o projeto precisa, <br>num só lugar.<\u002Fh1>\n        <p style=\"font-size:18px;color:#5E747B;margin:18px auto 0;max-width:560px;line-height:1.5\">Encontre a ferramenta certa em poucos cliques — sem montar página, sem perder tempo procurando.<\u002Fp>\n        <button onclick=\"{{ goComece }}\" style=\"margin-top:14px;border:none;background:transparent;color:#1E7C92;font-size:14.5px;font-weight:600;cursor:pointer;padding:6px 10px;border-radius:8px\" style-hover=\"background:#EAF6F9\">Primeiro projeto na Produtiva? Comece aqui →<\u002Fbutton>\n\n        <div style=\"display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #DCE7EB;border-radius:16px;padding:8px 8px 8px 18px;max-width:620px;margin:34px auto 0;box-shadow:0 6px 24px -12px rgba(22,59,69,0.18)\">\n          <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none\"><circle cx=\"11\" cy=\"11\" r=\"7\" stroke=\"#9DAEB4\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M20 20l-3.2-3.2\" stroke=\"#9DAEB4\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <input value=\"{{ query }}\" oninput=\"{{ onSearchInput }}\" onkeydown=\"{{ onSearchKey }}\" placeholder=\"O que você precisa encontrar?\" style=\"flex:1;border:none;outline:none;font-size:16.5px;color:#172A30;background:transparent;padding:8px 0\">\n          <button onclick=\"{{ runSearch }}\" style=\"border:none;background:#3DAFC7;color:#fff;font-size:15px;font-weight:600;padding:11px 22px;border-radius:11px;cursor:pointer\" style-hover=\"background:#2E9DB5\">Buscar<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:22px\">\n          <sc-for list=\"{{ quickChips }}\" as=\"c\" hint-placeholder-count=\"5\">\n            <button onclick=\"{{ c.go }}\" style=\"display:flex;align-items:center;gap:7px;border:1px solid #E2EBEE;background:#fff;color:#3C545B;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:100px;cursor:pointer\" style-hover=\"border-color:#9FD7E2;color:#1E7C92\">\n              <span style=\"width:7px;height:7px;border-radius:2px;background:{{ c.dot }}\"><\u002Fspan>{{ c.label }}\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"max-width:1200px;margin:0 auto;padding:54px 28px 80px\">\n      <!-- Por escopo -->\n      <div class=\"hg-stack-l\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px\">\n        <div>\n          <h2 style=\"font-size:23px;font-weight:700;color:#163B45;letter-spacing:-0.02em\">Por escopo<\u002Fh2>\n          <p style=\"font-size:14.5px;color:#7C9097;margin:5px 0 0\">As linhas de serviço da Produtiva, com as etapas e as ferramentas usadas em cada uma.<\u002Fp>\n        <\u002Fdiv>\n        <button onclick=\"{{ goEscopos }}\" style=\"border:none;background:transparent;color:#1E7C92;font-size:14px;font-weight:600;cursor:pointer\">Ver todos os escopos →<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasPorEscopo }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"hg-g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:18px\">\n        <sc-for list=\"{{ porEscopo }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <article onclick=\"{{ e.pick }}\" style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:13px;transition:box-shadow .15s,transform .15s\" style-hover=\"box-shadow:0 14px 34px -18px rgba(22,59,69,0.28);transform:translateY(-2px)\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px;background:{{ e.grupoBg }};color:{{ e.grupoCor }}\">{{ e.grupoLabel }}<\u002Fspan>\n              <span style=\"font-size:12px;color:#9DAEB4;font-weight:500\">{{ e.resumo }}<\u002Fspan>\n            <\u002Fdiv>\n            <div>\n              <h3 style=\"font-size:18px;font-weight:600;color:#163B45;letter-spacing:-0.01em;line-height:1.25\">{{ e.nome }}<\u002Fh3>\n              <p style=\"font-size:14px;color:#5E747B;margin:7px 0 0;line-height:1.5\">{{ e.descricao }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ semEscopos }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px dashed #C9DBE0;border-radius:16px;padding:26px;text-align:center;color:#8AA0A7;font-size:14px\">Os escopos ainda não foram cadastrados. Veja <b>fontes/README.md<\u002Fb> para gerar o rascunho a partir do Resumão dos escopos.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Cases recentes -->\n      <div class=\"hg-stack-l\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:54px 0 20px\">\n        <div>\n          <h2 style=\"font-size:23px;font-weight:700;color:#163B45;letter-spacing:-0.02em\">Banco de cases<\u002Fh2>\n          <p style=\"font-size:14.5px;color:#7C9097;margin:5px 0 0\">Projetos finalizados, contados por quem fez: história, resultados, documentos e vídeo da equipe.<\u002Fp>\n        <\u002Fdiv>\n        <button onclick=\"{{ goCases }}\" style=\"border:none;background:transparent;color:#1E7C92;font-size:14px;font-weight:600;cursor:pointer\">Ver todos os cases →<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasCasesRecentes }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"hg-g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:22px 18px\">\n        <sc-for list=\"{{ casesRecentes }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <article onclick=\"{{ c.open }}\" style=\"cursor:pointer;display:flex;flex-direction:column;gap:11px;transition:transform .15s ease\" style-hover=\"transform:translateY(-3px)\">\n            <div style=\"position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#EEF3F5;border:1px solid #E7EEF1;box-shadow:0 10px 26px -18px rgba(22,59,69,0.35)\">\n              <sc-if value=\"{{ c.hasFoto }}\" hint-placeholder-val=\"{{ false }}\"><img sc-camel-src=\"{{ c.fotoSrc }}\" alt=\"{{ c.cliente }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fsc-if>\n              <sc-if value=\"{{ c.semFoto }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:{{ c.placeholderBg }}\"><span style=\"font-family:'Schibsted Grotesk';font-size:46px;font-weight:700;letter-spacing:-0.02em;color:{{ c.escopoCor }};opacity:0.7\">{{ c.inicial }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n              <span style=\"position:absolute;top:10px;left:10px;max-width:calc(100% - 84px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;background:{{ c.escopoBg }};color:{{ c.escopoCor }};box-shadow:0 1px 4px rgba(0,0,0,0.08)\">{{ c.escopoNome }}<\u002Fspan>\n              <sc-if value=\"{{ c.local }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;color:#9A6B17;background:#FBF1E0;padding:4px 8px;border-radius:6px\" title=\"Só neste navegador · envie ao CIEP\">Só aqui<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{ c.hasVideo }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;right:10px;bottom:10px;background:rgba(14,26,30,0.72);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px\">▶ vídeo<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"padding:0 4px\">\n              <h3 style=\"font-size:16.5px;font-weight:600;color:#163B45;letter-spacing:-0.01em;line-height:1.25\">{{ c.cliente }}<\u002Fh3>\n              <p style=\"font-size:13px;color:#7C9097;margin:3px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.segmento }} · {{ c.periodoFmt }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ semCases }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background:linear-gradient(155deg,#1B4651 0%,#28697A 100%);border-radius:18px;padding:24px 26px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n          <div style=\"max-width:620px\">\n            <div style=\"font-size:17px;font-weight:700;font-family:'Schibsted Grotesk'\">Fechou um projeto que deu certo? Registre o case.<\u002Fdiv>\n            <p style=\"font-size:14px;color:#BFE2EA;margin:6px 0 0;line-height:1.5\">Cliente, escopo, equipe, o que foi feito e os resultados, com os documentos e um vídeo da equipe contando a história. Vira referência para o próximo projeto parecido.<\u002Fp>\n          <\u002Fdiv>\n          <button onclick=\"{{ goNovoCase }}\" style=\"border:none;background:#7FD3E3;color:#0C3540;font-size:14px;font-weight:700;padding:12px 20px;border-radius:10px;cursor:pointer;white-space:nowrap\" style-hover=\"background:#6AC7D9\">Cadastrar o primeiro case<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Novidades + Recomendados -->\n      <div class=\"hg-cols\" style=\"display:grid;grid-template-columns:1.55fr 1fr;gap:26px;margin-top:54px\">\n        <div style=\"min-width:0\">\n          <h2 style=\"font-size:23px;font-weight:700;color:#163B45;letter-spacing:-0.02em;margin-bottom:18px\">Novidades<\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ novidades }}\" as=\"item\" hint-placeholder-count=\"3\">\n              <article onclick=\"{{ item.open }}\" style=\"background:#fff;border:1px solid #E7EEF1;border-radius:14px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:16px\" style-hover=\"border-color:#C6E4EC\">\n                <div style=\"flex:none;width:46px;height:46px;border-radius:11px;background:{{ item.tipoBg }};display:flex;align-items:center;justify-content:center;color:{{ item.tipoColor }};font-family:'Schibsted Grotesk';font-weight:700;font-size:17px\">{{ item.initial }}<\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <h3 style=\"font-size:15.5px;font-weight:600;color:#163B45\">{{ item.nome }}<\u002Fh3>\n                    <span style=\"font-size:11px;font-weight:600;color:#2E9DB5;background:#EAF6F9;padding:2px 8px;border-radius:6px\">Novo<\u002Fspan>\n                  <\u002Fdiv>\n                  <p class=\"hg-clamp2\" style=\"font-size:13.5px;color:#7C9097;margin:3px 0 0;line-height:1.45\">{{ item.descricao }}<\u002Fp>\n                <\u002Fdiv>\n                <span class=\"hg-hide-m\" style=\"font-size:12.5px;color:#9DAEB4;flex:none\">{{ item.atualizadoFmt }}<\u002Fspan>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h2 style=\"font-size:23px;font-weight:700;color:#163B45;letter-spacing:-0.02em;margin-bottom:18px\">Recomendados para projetos<\u002Fh2>\n          <div style=\"background:linear-gradient(155deg,#1B4651 0%,#28697A 100%);border-radius:18px;padding:22px;color:#fff\">\n            <sc-if value=\"{{ hasRecomendados }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"font-size:14px;color:#BFE2EA;margin:0 0 16px;line-height:1.5\">Ferramentas de uso frequente nos projetos, prontas para aplicar.<\u002Fp><\u002Fsc-if>\n            <sc-if value=\"{{ semRecomendados }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:14px;color:#BFE2EA;margin:0 0 16px;line-height:1.5\">Ainda sem ferramentas marcadas como uso frequente. Enquanto isso, atalhos:<\u002Fp>\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ atalhos }}\" as=\"item\" hint-placeholder-count=\"3\">\n                  <button onclick=\"{{ item.go }}\" style=\"text-align:left;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);border-radius:11px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:11px\" style-hover=\"background:rgba(255,255,255,0.12)\">\n                    <span style=\"width:8px;height:8px;border-radius:50%;background:#7FD3E3;flex:none\"><\u002Fspan>\n                    <span style=\"flex:1;min-width:0\"><span style=\"display:block;font-size:14.5px;font-weight:600;color:#fff\">{{ item.label }}<\u002Fspan><span style=\"display:block;font-size:12px;color:#9FC6D0;margin-top:1px\">{{ item.hint }}<\u002Fspan><\u002Fspan>\n                    <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none\"><path d=\"M9 6l6 6-6 6\" stroke=\"#7FD3E3\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ recomendados }}\" as=\"item\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ item.open }}\" style=\"text-align:left;border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);border-radius:11px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;gap:11px\" style-hover=\"background:rgba(255,255,255,0.12)\">\n                  <span style=\"width:8px;height:8px;border-radius:50%;background:#7FD3E3;flex:none\"><\u002Fspan>\n                  <span style=\"flex:1;min-width:0\">\n                    <span style=\"display:block;font-size:14.5px;font-weight:600;color:#fff\">{{ item.nome }}<\u002Fspan>\n                    <span style=\"display:block;font-size:12px;color:#9FC6D0;margin-top:1px\">{{ item.categoria }} · {{ item.usoResumo }}<\u002Fspan>\n                  <\u002Fspan>\n                  <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none\"><path d=\"M9 6l6 6-6 6\" stroke=\"#7FD3E3\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ BIBLIOTECA ============ -->\n  <sc-if value=\"{{ isBiblioteca }}\" hint-placeholder-val=\"{{ true }}\">\n  <main class=\"hg-main\" style=\"max-width:1200px;margin:0 auto;padding:34px 28px 80px\">\n    <div style=\"margin-bottom:24px\">\n      <h1 style=\"font-size:30px;font-weight:700;color:#163B45;letter-spacing:-0.025em\">Biblioteca<\u002Fh1>\n      <p style=\"font-size:15px;color:#7C9097;margin:6px 0 0\">Todas as ferramentas, metodologias e templates do acervo.<\u002Fp>\n    <\u002Fdiv>\n\n    <button class=\"hg-only-m\" onclick=\"{{ toggleFiltros }}\" style=\"align-items:center;justify-content:center;gap:8px;width:100%;margin-bottom:12px;border:1px solid #DCE7EB;background:#fff;color:#1E7C92;font-size:14px;font-weight:600;padding:10px;border-radius:11px;cursor:pointer\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 6h16M7 12h10M10 18h4\" stroke=\"#1E7C92\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>{{ filtrosLabel }}<\u002Fbutton>\n    <div class=\"hg-cols\" style=\"display:grid;grid-template-columns:248px 1fr;gap:28px;align-items:start\">\n      <!-- Filtros -->\n      <aside class=\"hg-aside hg-filtros {{ filtrosClass }} ciep-scroll\" style=\"position:sticky;top:88px;background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:6px 4px;max-height:calc(100vh - 110px);overflow:auto\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px\">\n          <span style=\"display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#163B45\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M3 5h18M6 12h12M10 19h4\" stroke=\"#3DAFC7\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>Filtros<\u002Fspan>\n          <button onclick=\"{{ clearFilters }}\" style=\"border:none;background:transparent;color:#1E7C92;font-size:12.5px;font-weight:600;cursor:pointer\">Limpar<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-for list=\"{{ filterGroups }}\" as=\"g\" hint-placeholder-count=\"5\">\n          <div style=\"padding:10px 16px;border-top:1px solid #F0F4F5\">\n            <div style=\"font-size:12px;font-weight:700;color:#9DAEB4;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:9px\">{{ g.label }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <sc-for list=\"{{ g.options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                <label onclick=\"{{ opt.toggle }}\" style=\"display:flex;align-items:center;gap:9px;cursor:pointer;padding:5px 4px;border-radius:7px\" style-hover=\"background:#F6F9FA\">\n                  <sc-if value=\"{{ opt.active }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"width:17px;height:17px;border-radius:5px;background:#3DAFC7;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l4.5 4.5L19 7\" stroke=\"#fff\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ opt.inactive }}\" hint-placeholder-val=\"{{ true }}\">\n                    <span style=\"width:17px;height:17px;border-radius:5px;border:1.6px solid #D4E0E4;flex:none\"><\u002Fspan>\n                  <\u002Fsc-if>\n                  <span style=\"flex:1;font-size:13.5px;color:#3C545B\">{{ opt.label }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#B6C4C9;font-weight:500\">{{ opt.count }}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Faside>\n\n      <!-- Resultados -->\n      <div>\n        <div class=\"hg-wrap\" style=\"display:flex;align-items:center;gap:12px;margin-bottom:18px\">\n          <div style=\"display:flex;align-items:center;gap:9px;flex:1;min-width:200px;background:#fff;border:1px solid #DCE7EB;border-radius:11px;padding:9px 14px\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none\"><circle cx=\"11\" cy=\"11\" r=\"7\" stroke=\"#9DAEB4\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M20 20l-3.2-3.2\" stroke=\"#9DAEB4\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <input value=\"{{ query }}\" oninput=\"{{ onSearchInput }}\" placeholder=\"Buscar por nome, problema, responsável…\" style=\"flex:1;border:none;outline:none;font-size:14.5px;background:transparent\">\n          <\u002Fdiv>\n          <div style=\"display:flex;background:#EEF3F5;border-radius:10px;padding:3px;gap:2px\">\n            <sc-for list=\"{{ cardStyles }}\" as=\"cs\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ cs.set }}\" style=\"border:none;background:{{ cs.bg }};color:{{ cs.color }};font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer;box-shadow:{{ cs.shadow }}\">{{ cs.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n          <span style=\"font-size:13.5px;color:#7C9097\"><b style=\"color:#163B45\">{{ resultCount }}<\u002Fb> conteúdos<\u002Fspan>\n          <sc-if value=\"{{ hasActiveFilters }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n              <sc-for list=\"{{ activeChips }}\" as=\"ch\" hint-placeholder-count=\"2\">\n                <button onclick=\"{{ ch.remove }}\" style=\"display:flex;align-items:center;gap:6px;border:none;background:#EAF6F9;color:#1E7C92;font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;cursor:pointer\">{{ ch.label }} <span style=\"font-size:14px;line-height:1\">×<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- DETALHADO -->\n        <sc-if value=\"{{ isDetalhado }}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"hg-g2\" style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:16px\">\n          <sc-for list=\"{{ filtered }}\" as=\"item\" hint-placeholder-count=\"4\">\n            <article style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:13px\" style-hover=\"border-color:#C6E4EC\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between\">\n                <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px;background:{{ item.tipoBg }};color:{{ item.tipoColor }}\">{{ item.tipo }}<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:{{ item.statusColor }}\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ item.statusColor }}\"><\u002Fspan>{{ item.status }}<\u002Fspan>\n              <\u002Fdiv>\n              <div>\n                <h3 onclick=\"{{ item.open }}\" style=\"font-size:18px;font-weight:600;color:#163B45;letter-spacing:-0.01em;line-height:1.25;cursor:pointer\">{{ item.nome }}<\u002Fh3>\n                <p style=\"font-size:13.5px;color:#5E747B;margin:7px 0 0;line-height:1.5\">{{ item.descricao }}<\u002Fp>\n              <\u002Fdiv>\n              <sc-if value=\"{{ item.hasQuando }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:#F6F9FA;border-radius:10px;padding:10px 12px\">\n                <span style=\"font-size:11px;font-weight:700;color:#9DAEB4;letter-spacing:0.04em;text-transform:uppercase;white-space:nowrap\">Quando usar<\u002Fspan>\n                <p style=\"font-size:13px;color:#3C545B;margin:4px 0 0;line-height:1.45\">{{ item.quandoResumo }}<\u002Fp>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <span style=\"font-size:12px;color:#5E747B;background:#EFF4F5;padding:4px 9px;border-radius:6px\">{{ item.categoria }}<\u002Fspan>\n                <span style=\"font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;background:{{ item.complexBg }};color:{{ item.complexColor }}\">{{ item.complexidade }}<\u002Fspan>\n                <span style=\"font-size:12px;color:#5E747B;background:#EFF4F5;padding:4px 9px;border-radius:6px;display:flex;align-items:center;gap:5px\"><svg width=\"11
