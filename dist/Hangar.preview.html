background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:30px;height:30px;border-radius:8px;background:#EAF6F9;color:#1E7C92;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:14px;flex:none\">3<\u002Fspan><div><h2 style=\"font-size:17px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">A história<\u002Fh2><p style=\"font-size:13px;color:#8AA0A7;margin:2px 0 0\">Desafio, o que foi feito e o que mudou para o cliente<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Resumo em duas frases *<\u002Flabel><textarea value=\"{{ formCase.resumo }}\" oninput=\"{{ fc.resumo }}\" placeholder=\"O que o cliente precisava e o que a Produtiva entregou.\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;resize:vertical;line-height:1.5;color:#172A30\" style-focus=\"border-color:#9FD7E2\" rows=\"3\"><\u002Ftextarea><\u002Fdiv>\n        <div class=\"hg-g2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Desafio<\u002Flabel><textarea value=\"{{ formCase.desafio }}\" oninput=\"{{ fc.desafio }}\" placeholder=\"Como estava a situação quando o projeto começou?\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;resize:vertical;line-height:1.5;color:#172A30\" style-focus=\"border-color:#9FD7E2\" rows=\"5\"><\u002Ftextarea><\u002Fdiv>\n          <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">O que foi feito<\u002Flabel><textarea value=\"{{ formCase.solucao }}\" oninput=\"{{ fc.solucao }}\" placeholder=\"Etapas, decisões e entregas principais.\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;resize:vertical;line-height:1.5;color:#172A30\" style-focus=\"border-color:#9FD7E2\" rows=\"5\"><\u002Ftextarea><\u002Fdiv>\n          <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Resultados (um por linha)<\u002Flabel><textarea value=\"{{ formCase.resultados }}\" oninput=\"{{ fc.resultados }}\" placeholder=\"Ex.: Processo de pedidos reduzido de 6 para 3 etapas&#10;Gestor passou a acompanhar 5 indicadores por semana\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;resize:vertical;line-height:1.5;color:#172A30\" style-focus=\"border-color:#9FD7E2\" rows=\"5\"><\u002Ftextarea><\u002Fdiv>\n          <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Aprendizados (um por linha)<\u002Flabel><textarea value=\"{{ formCase.aprendizados }}\" oninput=\"{{ fc.aprendizados }}\" placeholder=\"O que você faria diferente ou repetiria.\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;resize:vertical;line-height:1.5;color:#172A30\" style-focus=\"border-color:#9FD7E2\" rows=\"5\"><\u002Ftextarea><\u002Fdiv>\n        <\u002Fdiv>\n        <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Depoimento do cliente (opcional)<\u002Flabel><textarea value=\"{{ formCase.depoimento }}\" oninput=\"{{ fc.depoimento }}\" placeholder=\"Uma frase do gestor sobre o projeto.\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;resize:vertical;line-height:1.5;color:#172A30\" style-focus=\"border-color:#9FD7E2\" rows=\"2\"><\u002Ftextarea><\u002Fdiv>\n        <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Tags (separadas por vírgula)<\u002Flabel><input value=\"{{ formCase.tags }}\" oninput=\"{{ fc.tags }}\" placeholder=\"Ex.: delivery, precificação, família\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:30px;height:30px;border-radius:8px;background:#EAF6F9;color:#1E7C92;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:14px;flex:none\">4<\u002Fspan><div><h2 style=\"font-size:17px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">Ferramentas usadas<\u002Fh2><p style=\"font-size:13px;color:#8AA0A7;margin:2px 0 0\">Clique para marcar. Elas aparecem na ficha do case e o case aparece na ficha da ferramenta.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <input value=\"{{ caseFiltroFerr }}\" oninput=\"{{ onCaseFiltroFerr }}\" placeholder=\"Filtrar ferramentas…\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ ferrChips }}\" as=\"f\" hint-placeholder-count=\"8\">\n            <button onclick=\"{{ f.toggle }}\" style=\"border:1.5px solid {{ f.border }};background:{{ f.bg }};color:{{ f.color }};font-size:13px;font-weight:600;padding:7px 12px;border-radius:100px;cursor:pointer\">{{ f.nome }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8AA0A7\">{{ nFerrEscolhidas }} selecionada(s)<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:30px;height:30px;border-radius:8px;background:#EAF6F9;color:#1E7C92;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:14px;flex:none\">5<\u002Fspan><div><h2 style=\"font-size:17px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">Documentos<\u002Fh2><p style=\"font-size:13px;color:#8AA0A7;margin:2px 0 0\">Suba os arquivos na pasta do Drive \"Banco de Cases / cliente\", com acesso para a Produtiva, e cole o link de cada um.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ docsRows }}\" as=\"d\" hint-placeholder-count=\"2\">\n            <div class=\"hg-form\" style=\"display:grid;grid-template-columns:1.2fr 1fr 2fr auto;gap:10px;align-items:center\">\n              <input value=\"{{ d.nome }}\" oninput=\"{{ d.setNome }}\" placeholder=\"Nome do arquivo\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\">\n              <select value=\"{{ d.tipo }}\" onchange=\"{{ d.setTipo }}\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\"><sc-for list=\"{{ d.tipoOptions }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption><\u002Fsc-for><\u002Fselect>\n              <input value=\"{{ d.url }}\" oninput=\"{{ d.setUrl }}\" placeholder=\"https://drive.google.com/…\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\">\n              <button onclick=\"{{ d.remove }}\" title=\"Remover\" style=\"border:1px solid #E2EBEE;background:#fff;color:#7C9097;width:38px;height:42px;border-radius:9px;cursor:pointer;font-size:18px\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button onclick=\"{{ addDoc }}\" style=\"align-self:flex-start;border:1px dashed #C9DBE0;background:#FAFCFC;color:#1E7C92;font-size:13.5px;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer\">+ Adicionar documento<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:30px;height:30px;border-radius:8px;background:#EAF6F9;color:#1E7C92;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:14px;flex:none\">6<\u002Fspan><div><h2 style=\"font-size:17px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">Foto do projeto<\u002Fh2><p style=\"font-size:13px;color:#8AA0A7;margin:2px 0 0\">Uma imagem que represente o projeto: a equipe com o cliente, o produto, a loja. É a capa do case na galeria e na ficha.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <input id=\"hangar-foto-input\" type=\"file\" accept=\"image/*\" onchange=\"{{ onFotoArquivo }}\" style=\"display:none\">\n        <sc-if value=\"{{ semFotoPreview }}\" hint-placeholder-val=\"{{ true }}\">\n          <div onclick=\"{{ abrirSeletorFoto }}\" ondrop=\"{{ onFotoDrop }}\" sc-camel-on-drag-over=\"{{ onFotoDragOver }}\" style=\"border:2px dashed #C9DBE0;border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;background:#FAFCFC\" style-hover=\"border-color:#9FD7E2;background:#F3FAFB\">\n            <svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"display:block;margin:0 auto 10px\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"3\" stroke=\"#3DAFC7\" stroke-width=\"1.7\"><\u002Frect><circle cx=\"8.5\" cy=\"10\" r=\"1.6\" fill=\"#3DAFC7\"><\u002Fcircle><path d=\"M21 16l-5-5-8 8\" stroke=\"#3DAFC7\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:14.5px;font-weight:600;color:#163B45\">Arraste uma foto aqui ou clique para escolher<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#8AA0A7;margin-top:4px\">JPG, PNG ou WebP · a imagem é reduzida automaticamente e vai dentro do arquivo do case<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"><span style=\"font-size:13px;color:#8AA0A7;white-space:nowrap\">ou cole o link de uma imagem no Drive:<\u002Fspan><input value=\"{{ formCase.fotoLink }}\" oninput=\"{{ fc.fotoLink }}\" placeholder=\"https://drive.google.com/file/d/…\" style=\"flex:1;min-width:240px;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasFotoPreview }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap\">\n            <img sc-camel-src=\"{{ fotoPreview }}\" alt=\"Pré-visualização da foto\" style=\"width:300px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid #E7EEF1;background:#EEF3F5;display:block\">\n            <div style=\"flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px\">\n              <div style=\"font-size:13px;color:#5E747B;line-height:1.5\">{{ fotoFonte }}<\u002Fdiv>\n              <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Legenda (opcional)<\u002Flabel><input value=\"{{ formCase.fotoLegenda }}\" oninput=\"{{ fc.fotoLegenda }}\" placeholder=\"Ex.: Equipe com o gestor na entrega final\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\"><\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <button onclick=\"{{ abrirSeletorFoto }}\" style=\"border:1px solid #DCE7EB;background:#fff;color:#1E7C92;font-size:13px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer\" style-hover=\"border-color:#9FD7E2\">Trocar foto<\u002Fbutton>\n                <button onclick=\"{{ removerFoto }}\" style=\"border:none;background:transparent;color:#9DAEB4;font-size:13px;font-weight:600;padding:8px 6px;cursor:pointer\">Remover<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:30px;height:30px;border-radius:8px;background:#EAF6F9;color:#1E7C92;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:14px;flex:none\">7<\u002Fspan><div><h2 style=\"font-size:17px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">Vídeo da equipe<\u002Fh2><p style=\"font-size:13px;color:#8AA0A7;margin:2px 0 0\">Gerente e consultores contando o projeto em 3 a 8 minutos. Link do Drive ou do YouTube (não listado).<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"hg-form\" style=\"display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px\">\n          <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Link do vídeo<\u002Flabel><input value=\"{{ formCase.videoUrl }}\" oninput=\"{{ fc.videoUrl }}\" placeholder=\"https://drive.google.com/file/d/… ou https://youtu.be/…\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\"><\u002Fdiv>\n          <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Quem aparece<\u002Flabel><input value=\"{{ formCase.videoQuem }}\" oninput=\"{{ fc.videoQuem }}\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\"><\u002Fdiv>\n          <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Duração<\u002Flabel><input value=\"{{ formCase.videoDuracao }}\" oninput=\"{{ fc.videoDuracao }}\" placeholder=\"Ex.: 6 min\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\"><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasVideoPreview }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#0E1A1E;max-width:640px\"><iframe sc-camel-src=\"{{ videoPreview }}\" allowfullscreen=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;border:0\"><\u002Fiframe><\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:30px;height:30px;border-radius:8px;background:#EAF6F9;color:#1E7C92;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:14px;flex:none\">8<\u002Fspan><div><h2 style=\"font-size:17px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">Você<\u002Fh2><p style=\"font-size:13px;color:#8AA0A7;margin:2px 0 0\">Quem está cadastrando. Fica lembrado neste navegador.<\u002Fp><\u002Fdiv><\u002Fdiv>\n        <div class=\"hg-g2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n          <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Seu nome *<\u002Flabel><input value=\"{{ formCase.meuNome }}\" oninput=\"{{ fc.meuNome }}\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\"><\u002Fdiv>\n          <div><label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Seu e-mail<\u002Flabel><input value=\"{{ formCase.meuEmail }}\" oninput=\"{{ fc.meuEmail }}\" placeholder=\"nome@produtivajunior.com.br\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasCaseErro }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#FCF3F4;border:1px solid #E6AFB5;border-radius:12px;padding:12px 16px;font-size:13.5px;color:#B23B47;font-weight:600\">{{ caseErro }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n        <button onclick=\"{{ publishCase }}\" style=\"border:none;background:#3DAFC7;color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:11px;cursor:pointer\" style-hover=\"background:#2E9DB5\">Publicar no meu Hangar<\u002Fbutton>\n        <button onclick=\"{{ baixarCaseForm }}\" style=\"border:1px solid #DCE7EB;background:#fff;color:#1E7C92;font-size:14px;font-weight:600;padding:12px 18px;border-radius:11px;cursor:pointer\" style-hover=\"border-color:#9FD7E2\">Baixar case (.json)<\u002Fbutton>\n        <button onclick=\"{{ copiarCaseForm }}\" style=\"border:1px solid #DCE7EB;background:#fff;color:#5E747B;font-size:14px;font-weight:600;padding:12px 18px;border-radius:11px;cursor:pointer\">Copiar JSON<\u002Fbutton>\n        <button onclick=\"{{ limparCase }}\" style=\"border:none;background:transparent;color:#9DAEB4;font-size:13.5px;font-weight:600;padding:12px 8px;cursor:pointer\">Limpar<\u002Fbutton>\n        <span style=\"font-size:12.5px;color:#8AA0A7;flex:1;min-width:220px\">Publicar salva neste navegador. Para o case aparecer para toda a Produtiva, baixe o arquivo e envie ao CIEP.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ COMECE AQUI (trilha do primeiro projeto + glossário) ============ -->\n  <sc-if value=\"{{ isComece }}\" hint-placeholder-val=\"{{ false }}\">\n  <main class=\"hg-main\" style=\"max-width:1000px;margin:0 auto;padding:34px 28px 80px\">\n    <div style=\"display:inline-flex;align-items:center;gap:8px;background:#EAF6F9;color:#1E7C92;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:100px;margin-bottom:14px\">Trilha do primeiro projeto<\u002Fdiv>\n    <h1 style=\"font-size:32px;font-weight:700;color:#163B45;letter-spacing:-0.025em;line-height:1.12\">Seu primeiro projeto na Produtiva<\u002Fh1>\n    <p style=\"font-size:15.5px;color:#5E747B;margin:10px 0 0;line-height:1.55;max-width:700px\">Seis passos para chegar ao cliente sabendo o que fazer. Marque o que já fez; fica lembrado neste navegador.<\u002Fp>\n\n    <div style=\"display:flex;align-items:center;gap:14px;margin:22px 0 26px;background:#fff;border:1px solid #E7EEF1;border-radius:14px;padding:14px 18px\">\n      <div style=\"flex:1;height:8px;border-radius:100px;background:#EEF3F5;overflow:hidden\"><div style=\"height:100%;width:{{ trilhaPct }}%;background:#3DAFC7;border-radius:100px;transition:width .3s ease\"><\u002Fdiv><\u002Fdiv>\n      <span style=\"font-size:13.5px;font-weight:600;color:#163B45;white-space:nowrap\">{{ trilhaFeitos }} de {{ trilhaTotal }}<\u002Fspan>\n    <\u002Fdiv>\n    <sc-if value=\"{{ trilhaCompleta }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:#EAF7EE;border:1px solid #BFE6CD;border-radius:14px;padding:14px 18px;margin:-12px 0 22px;font-size:14px;color:#2E7D52;font-weight:600\">Trilha completa. Agora é projeto de verdade: bom trabalho.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <sc-for list=\"{{ trilhaPassos }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <article style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px 22px;display:flex;gap:16px;align-items:flex-start\">\n          <button onclick=\"{{ p.toggle }}\" title=\"Marcar como feito\" style=\"flex:none;width:34px;height:34px;border-radius:10px;border:1.6px solid #D4E0E4;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:14px;color:#1E7C92\" style-hover=\"border-color:#3DAFC7\">\n            <sc-if value=\"{{ p.feito }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l4.5 4.5L19 7\" stroke=\"#2E7D52\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n            <sc-if value=\"{{ p.pendente }}\" hint-placeholder-val=\"{{ true }}\">{{ p.n }}<\u002Fsc-if>\n          <\u002Fbutton>\n          <div style=\"flex:1;min-width:0\">\n            <h3 style=\"font-size:17px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk';line-height:1.3\">{{ p.titulo }}<\u002Fh3>\n            <p style=\"font-size:14px;color:#5E747B;margin:6px 0 0;line-height:1.55\">{{ p.texto }}<\u002Fp>\n            <sc-if value=\"{{ p.listaFerramentas }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-if value=\"{{ hasEssenciais }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:12px\">\n                <sc-for list=\"{{ essenciais }}\" as=\"item\" hint-placeholder-count=\"5\">\n                  <button onclick=\"{{ item.open }}\" style=\"display:flex;align-items:center;gap:8px;border:1px solid #DCE7EB;background:#FAFCFC;color:#163B45;font-size:13.5px;padding:8px 12px;border-radius:10px;cursor:pointer\" style-hover=\"border-color:#9FD7E2;background:#EAF6F9\"><span style=\"width:8px;height:8px;border-radius:2px;background:{{ item.tipoColor }}\"><\u002Fspan>{{ item.nome }}<span style=\"font-size:12px;color:#9DAEB4\">· {{ item.usoResumo }}<\u002Fspan><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ p.hasAcao }}\" hint-placeholder-val=\"{{ true }}\">\n              <button onclick=\"{{ p.ir }}\" style=\"margin-top:12px;border:none;background:transparent;color:#1E7C92;font-size:14px;font-weight:600;cursor:pointer;padding:0\">{{ p.acaoLabel }} →<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasResponsaveis }}\" hint-placeholder-val=\"{{ false }}\">\n    <h2 style=\"font-size:23px;font-weight:700;color:#163B45;letter-spacing:-0.02em;margin:44px 0 6px\">Quem procurar<\u002Fh2>\n    <p style=\"font-size:14.5px;color:#7C9097;margin:0 0 16px\">Responsáveis pelos conteúdos do acervo. Dúvida sobre uma ferramenta? Comece por quem cuida dela.<\u002Fp>\n    <div class=\"hg-g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px\">\n      <sc-for list=\"{{ responsaveis }}\" as=\"r\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px\">\n          <div style=\"width:36px;height:36px;border-radius:50%;background:#163B45;color:#fff;font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;flex:none\">{{ r.iniciais }}<\u002Fdiv>\n          <div style=\"min-width:0\"><div style=\"font-size:14px;font-weight:600;color:#163B45\">{{ r.nome }}<\u002Fdiv><div style=\"font-size:12px;color:#8AA0A7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.resumo }}<sc-if value=\"{{ r.hasEmail }}\" hint-placeholder-val=\"{{ false }}\"> · {{ r.email }}<\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <h2 style=\"font-size:23px;font-weight:700;color:#163B45;letter-spacing:-0.02em;margin:44px 0 6px\">Glossário<\u002Fh2>\n    <p style=\"font-size:14.5px;color:#7C9097;margin:0 0 14px\">Siglas e nomes que aparecem nos cronogramas, nos escopos e nas conversas. Termos marcados \"a confirmar\" ainda não têm definição oficial do CIEP.<\u002Fp>\n    <div style=\"display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #DCE7EB;border-radius:11px;padding:9px 14px;margin-bottom:14px;max-width:420px\">\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none\"><circle cx=\"11\" cy=\"11\" r=\"7\" stroke=\"#9DAEB4\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M20 20l-3.2-3.2\" stroke=\"#9DAEB4\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n      <input value=\"{{ glossQuery }}\" oninput=\"{{ onGlossQuery }}\" placeholder=\"Buscar sigla ou termo…\" style=\"flex:1;border:none;outline:none;font-size:14.5px;background:transparent\">\n    <\u002Fdiv>\n    <div class=\"hg-g2\" style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:12px\">\n      <sc-for list=\"{{ glossario }}\" as=\"g\" hint-placeholder-count=\"8\">\n        <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:14px;padding:16px 18px\">\n          <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n            <span style=\"font-family:'Schibsted Grotesk';font-size:16px;font-weight:700;color:#163B45\">{{ g.sigla }}<\u002Fspan>\n            <sc-if value=\"{{ g.hasNome }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:13px;color:#5E747B\">{{ g.nome }}<\u002Fspan><\u002Fsc-if>\n            <sc-if value=\"{{ g.pendente }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11px;font-weight:600;color:#9A6B17;background:#FBF1E0;padding:3px 8px;border-radius:6px\" title=\"Definição ainda não confirmada pelo CIEP\">a confirmar<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <p style=\"font-size:13.5px;color:#3C545B;margin:7px 0 0;line-height:1.5\">{{ g.definicao }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ semGlossario }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"font-size:14px;color:#8AA0A7;margin:8px 0 0\">Nenhum termo com essa palavra.<\u002Fp><\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ RECOMENDAR ============ -->\n  <sc-if value=\"{{ isRecomendar }}\" hint-placeholder-val=\"{{ false }}\">\n  <main class=\"hg-main\" style=\"max-width:900px;margin:0 auto;padding:48px 28px 80px\">\n    <div style=\"text-align:center\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:#EAF6F9;color:#1E7C92;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:100px;margin-bottom:18px\">Recomendação rápida<\u002Fdiv>\n      <h1 style=\"font-size:34px;font-weight:700;color:#163B45;letter-spacing:-0.025em\">Qual problema você quer resolver?<\u002Fh1>\n      <p style=\"font-size:16px;color:#5E747B;margin:12px 0 0\">Escolha um objetivo e a biblioteca sugere as ferramentas certas.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:34px\">\n      <sc-for list=\"{{ problemas }}\" as=\"p\" hint-placeholder-count=\"8\">\n        <button onclick=\"{{ p.pick }}\" style=\"border:1.5px solid {{ p.border }};background:{{ p.bg }};color:{{ p.color }};font-size:14px;font-weight:600;padding:11px 17px;border-radius:100px;cursor:pointer\" style-hover=\"border-color:#9FD7E2\">{{ p.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasReco }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:44px;animation:ciepPop .25s ease\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:18px\">\n          <span style=\"font-size:14px;color:#7C9097\">Para<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:700;color:#163B45;background:#EAF6F9;padding:5px 13px;border-radius:8px\">{{ recoLabel }}<\u002Fspan>\n          <span style=\"font-size:14px;color:#7C9097\">recomendamos:<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"hg-g2\" style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:16px\">\n          <sc-for list=\"{{ recoResults }}\" as=\"item\" hint-placeholder-count=\"2\">\n            <article onclick=\"{{ item.open }}\" style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px;cursor:pointer;display:flex;gap:15px;align-items:flex-start\" style-hover=\"border-color:#C6E4EC;box-shadow:0 12px 30px -18px rgba(22,59,69,0.25)\">\n              <div style=\"flex:none;width:46px;height:46px;border-radius:12px;background:{{ item.tipoBg }};color:{{ item.tipoColor }};display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:18px\">{{ item.initial }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:center;gap:8px\"><h3 style=\"font-size:16.5px;font-weight:600;color:#163B45\">{{ item.nome }}<\u002Fh3><\u002Fdiv>\n                <p style=\"font-size:13.5px;color:#5E747B;margin:6px 0 0;line-height:1.5\">{{ item.descricao }}<\u002Fp>\n                <div style=\"display:flex;gap:7px;margin-top:11px\">\n                  <span style=\"font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:{{ item.tipoBg }};color:{{ item.tipoColor }}\">{{ item.tipo }}<\u002Fspan>\n                  <span style=\"font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:{{ item.complexBg }};color:{{ item.complexColor }}\">{{ item.complexidade }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ DOCUMENTAÇÃO ============ -->\n  <sc-if value=\"{{ isDocs }}\" hint-placeholder-val=\"{{ false }}\">\n  <main class=\"hg-main\" style=\"max-width:1340px;margin:0 auto;padding:30px 28px 64px\">\n    <div style=\"margin-bottom:8px\"><span style=\"font-size:12.5px;font-weight:600;color:#1E7C92;background:#EAF6F9;padding:5px 11px;border-radius:7px\">Painel do CIEP<\u002Fspan><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:10px;margin-top:12px\">\n      <h1 style=\"font-size:30px;font-weight:700;color:#163B45;letter-spacing:-0.025em\">Geração automática de documentação<\u002Fh1>\n      <span style=\"font-size:11.5px;font-weight:700;color:#1E7C92;background:#EAF6F9;padding:4px 10px;border-radius:7px;letter-spacing:0.04em\">METODOLOGIA<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:15px;color:#7C9097;margin:6px 0 0;line-height:1.5;max-width:720px\">Descreva a ferramenta em alto nível e a plataforma <b style=\"color:#3C545B;font-weight:600\">gera a metodologia completa automaticamente<\u002Fb> — introdução, blocos e perguntas-chave, no formato padrão da Produtiva JR. Revise no editor e o preview à direita atualiza em tempo real.<\u002Fp>\n\n    <div class=\"hg-cols\" style=\"display:grid;grid-template-columns:430px 1fr;gap:26px;align-items:start;margin-top:24px\">\n      <!-- EDITOR -->\n      <aside class=\"hg-aside ciep-scroll\" style=\"position:sticky;top:88px;max-height:calc(100vh - 110px);overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px\">\n        <!-- Gerar com IA -->\n        <div style=\"background:linear-gradient(155deg,#EAF6F9 0%,#F4FBFC 100%);border:1.5px solid #C6E4EC;border-radius:16px;padding:18px\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:6px\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"#1E7C92\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:14.5px;font-weight:700;color:#163B45;font-family:'Schibsted Grotesk'\">Gerar com IA<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:#5E747B;margin:0 0 11px;line-height:1.5\">Descreva a ferramenta em alto nível. A IA devolve o documento completo, já destrinchado — você só revisa.<\u002Fp>\n          <textarea value=\"{{ aiDocInputVal }}\" oninput=\"{{ setAiDocInput }}\" placeholder=\"Ex.: A Matriz GUT prioriza problemas por Gravidade, Urgência e Tendência. Usada em diagnóstico para decidir o que atacar primeiro…\" style=\"width:100%;border:1px solid #C6E4EC;border-radius:10px;padding:11px 13px;font-size:13.5px;outline:none;resize:vertical;height:96px;line-height:1.5;background:#fff\" style-focus=\"border-color:#7FC4D4\"><\u002Ftextarea>\n          <sc-if value=\"{{ hasAiError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:#B23B47;margin-top:8px;line-height:1.4\">{{ aiError }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button onclick=\"{{ generateDoc }}\" disabled=\"{{ aiLoading }}\" style=\"width:100%;margin-top:11px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;background:#3DAFC7;color:#fff;font-size:14px;font-weight:600;padding:11px;border-radius:11px;cursor:pointer\" style-hover=\"background:#2E9DB5\">\n            <sc-if value=\"{{ aiLoading }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"width:15px;height:15px;border:2px solid rgba(255,255,255,0.45);border-top-color:#fff;border-radius:50%;display:inline-block;animation:ciepSpin .7s linear infinite\"><\u002Fspan>Gerando…\n            <\u002Fsc-if>\n            <sc-if value=\"{{ aiNotLoading }}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>{{ aiBtnLabel }}\n            <\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px\">\n          <div style=\"font-size:12px;font-weight:700;color:#9DAEB4;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:14px\">Informações da ferramenta<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:13px\">\n            <div>\n              <label style=\"display:block;font-size:12.5px;font-weight:600;color:#3C545B;margin-bottom:6px\">Nome da ferramenta<\u002Flabel>\n              <input value=\"{{ docNomeVal }}\" oninput=\"{{ docNome }}\" style=\"width:100%;border:1px solid #DCE7EB;border-radius:9px;padding:9px 12px;font-size:13.5px;outline:none\" style-focus=\"border-color:#9FD7E2\">\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:11px\">\n              <div style=\"width:120px\">\n                <label style=\"display:block;font-size:12.5px;font-weight:600;color:#3C545B;margin-bottom:6px\">Sigla<\u002Flabel>\n                <input value=\"{{ docSiglaVal }}\" oninput=\"{{ docSigla }}\" style=\"width:100%;border:1px solid #DCE7EB;border-radius:9px;padding:9px 12px;font-size:1 o\",\"freq\":\"Alta\",\"responsavel\":{\"nome\":\"Vinícius Moraes\",\"email\":\"viniciusmoraes@produtivajunior.com.br\"},\"atualizado\":\"2026-09-07\",\"descricao\":\"Mapa das etapas, pontos de contato e emoções do cliente com a empresa, hoje e como deveria ser.\",\"objetivo\":\"\",\"problema\":\"\",\"quandoUsar\":[],\"quandoNao\":[],\"entradas\":[],\"saidas\":[],\"passos\":[],\"perguntas\":[],\"cuidados\":[],\"exemplos\":[],\"anexos\":[],\"fontes\":[{\"tipo\":\"manual\",\"id\":\"viniciusmoraes@produtivajunior.com.br\",\"nome\":\"Stub: sem arquivo-fonte no Drive\",\"hash\":null}],\"origem\":{\"nome\":\"manual:viniciusmoraes@produtivajunior.com.br\",\"tipo\":\"manual:viniciusmoraes@produtivajunior.com.br\",\"categoria\":\"manual:viniciusmoraes@produtivajunior.com.br\",\"complexidade\":\"manual:viniciusmoraes@produtivajunior.com.br\",\"tempo\":\"manual:viniciusmoraes@produtivajunior.com.br\",\"freq\":\"manual:viniciusmoraes@produtivajunior.com.br\",\"responsavel\":\"manual:viniciusmoraes@produtivajunior.com.br\",\"descricao\":\"manual:viniciusmoraes@produtivajunior.com.br\",\"anexos\":\"manual:viniciusmoraes@produtivajunior.com.br\"},\"pendencias\":[\"Só aplicações em cliente (Jornada do Cliente To Be / As Is); falta metodologia e modelo padrão.\"],\"revisao\":{\"status\":\"rascunho\",\"revisor\":null,\"data\":null}},{\"id\":\"mapa-de-contexto\",\"nome\":\"Mapa de Contexto\",\"tipo\":\"Ferramenta\",\"categoria\":\"Entendimento\",\"complexidade\":\"Baixo\",\"tempo\":\"2–3h\",\"status\":\"Em revisão\",\"freq\":\"Média\",\"responsavel\":{\"nome\":\"Carlos Eduardo\",\"email\":\"carloseduardo@produtivajunior.com.br\"},\"atualizado\":\"2026-09-07\",\"descricao\":\"O Mapa de Contexto é uma ferramenta utilizada para apresentar de forma esquemática e visual as funções presentes em uma organização, bem como a relação do cliente com o fornecedor existente entre essas funções.\",\"objetivo\":\"Essa ferramenta proporciona uma visão geral da empresa antes que se inicie a identificação dos processos para depois ocorrer o mapeamento dos mesmos.\",\"problema\":\"A utilização do mapa de contexto é essencial por diversos motivos: Compreensão global: Fornece uma visão geral do sistema e de seu contexto, ajudando a compreender as interações entre diferentes partes; Identificação de limites: Ajuda a definir claramente os limites do sistema em estudo, distinguindo o que está dentro e fora do escopo; Comunicação eficaz: Facilita a comunicação entre as partes interessadas, permitindo que todos tenham uma compreensão comum do sistema e de seu ambiente; Tomada de decisão: Facilita a identificação de oportunidades e desafios, auxiliando na tomada de decisões informadas.\",\"quandoUsar\":[\"A utilização do mapa de contexto é essencial por diversos motivos: Compreensão global: Fornece uma visão geral do sistema e de seu contexto, ajudando a compreender as interações entre diferentes partes; Identificação de limites: Ajuda a definir claramente os limites do sistema em estudo, distinguindo o que está dentro e fora do escopo; Comunicação eficaz: Facilita a comunicação entre as partes interessadas, permitindo que todos tenham uma compreensão comum do sistema e de seu ambiente; Tomada de decisão: Facilita a identificação de oportunidades e desafios, auxiliando na tomada de decisões informadas\",\"Clareza na definição do escopo: Mostra em determinado processo o que está dentro e fora do sistema, evitando retrabalho e confusão sobre responsabilidades\",\"Comunicação simples e eficiente: Facilita o entendimento entre diferentes áreas pela sua apresentação visual\",\"Identificação dos stakeholders e suas interações: Através do mapa é possível visualizar quem interage com o sistema e também auxilia no entendimento de quem é dependente dele\",\"Suporte à modelagens de processos: Funciona como uma primeira etapa antes de se iniciar os fluxogramas e outras ferramentas de mapeamento\",\"É importante pois evita perder tempo detalhando o que ainda não está bem compreendido\"],\"quandoNao\":null,\"entradas\":[\"Lista de áreas e departamentos da empresa\",\"Partes interessadas internas e externas\"],\"saidas\":[\"Mapa visual do sistema, agentes externos e fluxos\",\"Fronteira clara do que está dentro e fora do escopo\"],\"passos\":[\"Identificar elementos chave — Liste as principais áreas ou departamentos da empresa; Identifique partes interessadas internas e externas, como: clientes, acionistas, parceiros, etc; Destaque processos operacionais e estratégicos essenciais.\",\"Definir relações — Indique as relações e interações entre diferentes áreas da empresa.\",\"Adicionar contexto externo — Inclua fatores externos que afetam a empresa, como regulamentações, concorrentes, tendências de mercado, etc; Represente a cadeia de suprimentos, se aplicável, mostrando conexões com fornecedores e distribuidores.\",\"Mapear Fluxos e Limites — Identifique as entradas (inputs) e saídas (outputs) de informações e materiais entre a empresa e os agentes externos; Delimite a fronteira do sistema, esclarecendo o que pertence ao processo interno e o que pertence ao ambiente externo; Estabeleça a direção dos fluxos para garantir que a troca de valor entre as partes esteja lógica antes da desenhar.\",\"Apresentar de forma visual — Utilize gráficos, setas e rótulos para tornar o mapa visualmente compreensível; Considere o uso de cores para diferenciar diferentes elementos ou destacar áreas críticas.\"],\"perguntas\":null,\"cuidados\":null,\"exemplos\":null,\"anexos\":[{\"nome\":\"[CIEP] Metodologia de Mapa de Contexto.pdf\",\"tipo\":\"Metodologia (PDF)\",\"descricao\":\"O que é, importância, construção em 5 passos e benefícios.\",\"versao\":\"v1.0\",\"data\":\"2026-09-07\",\"driveId\":\"1I8J5SrhpVpjwO-jPKVqhQAx7KN6cI6gm\",\"url\":\"https://drive.google.com/file/d/1I8J5SrhpVpjwO-jPKVqhQAx7KN6cI6gm/view\"},{\"nome\":\"[CIEP] Modelo PPT Mapa de Contexto.pdf\",\"tipo\":\"Modelo padrão\",\"descricao\":\"Slides-modelo para apresentar o mapa ao cliente.\",\"versao\" "status\":\"rascunho\",\"revisor\":null,\"data\":null}},{\"id\":\"pmmc\",\"nome\":\"Process Map Model Canvas (PMMC)\",\"tipo\":\"Metodologia\",\"categoria\":\"Processos\",\"complexidade\":\"Médio\",\"tempo\":\"1 reunião de 2h + consolidação\",\"status\":\"Em revisão\",\"freq\":\"Alta\",\"responsavel\":{\"nome\":\"Carlos Eduardo\",\"email\":\"carloseduardo@produtivajunior.com.br\"},\"atualizado\":\"2026-09-07\",\"descricao\":\"O Process Map Model Canvas (PMMC) é uma ferramenta visual projetada para simplificar a análise e o redesenho de processos.\",\"objetivo\":\"Funcionando como um guia prático, ele condensa em uma única página os 10 blocos essenciais que compõem o fluxo de valor, garantindo uma visão sistêmica e facilitando a validação do entendimento junto ao gestor.\",\"problema\":null,\"quandoUsar\":null,\"quandoNao\":null,\"entradas\":[\"Reunião ou brainstorming com o gestor e a equipe do processo\",\"Documentos existentes: POPs, manuais, fluxogramas antigos\"],\"saidas\":[\"Canvas PMMC preenchido e validado com o gestor\",\"Base para o mapeamento AS IS e para o relatório de melhorias\"],\"passos\":[\"Principais Fornecedores — Este é o ponto de partida lógico do mapeamento.\",\"Principais Insumos — Os insumos representam a \\\"matéria-prima\\\" do processo.\",\"Principais Atividades — Este é o motor da operação.\",\"Principais Produtos — Os produtos são a materialização do valor gerado pelas atividades.\",\"Principais Clientes — Nenhum processo existe sem um propósito ou um destinatário.\",\"Recursos Humanos — Este quadrante foca nas pessoas.\",\"Recursos Tecnológicos — Além das pessoas, a maioria dos processos modernos depende de uma base tecnológica para funcionar.\",\"Finalidade e Melhorias — Este bloco conecta a operação à estratégia.\",\"Indicadores de Performance — \\\"O que não é medido não é gerenciado\\\".\",\"Ferramentas de Controle — Para fechar o canvas, temos a governança.\"],\"perguntas\":[\"De onde são retirados os insumos envolvidos no processo?\",\"O fornecedor é externo (outra empresa) ou interno (outro setor/processo)?\",\"Quem é o responsável direto por disponibilizar o recurso no tempo certo?\",\"Quais são os inputs (físicos ou intelectuais) que serão processados?\",\"O que é indispensável receber para que a atividade possa começar?\",\"Os insumos chegam no padrão ou formato correto para serem utilizados?\",\"Quais atividades são desempenhadas desde o repasse dos insumos até a finalização da proposta de valor?\",\"Quais são as etapas críticas de transformação que não podem faltar?\",\"Existe uma sequência lógica clara entre as ações listadas?\",\"Quais são as informações de saída ou resultados tangíveis resultantes do processo?\",\"O que é efetivamente entregue ao final das atividades listadas?\",\"O produto atende aos requisitos de qualidade esperados?\",\"Quem são os beneficiários do processo?\",\"Para quem o produto é destinado?\",\"O cliente é o consumidor final ou uma etapa posterior interna?\",\"Quem e quantos são os responsáveis pela execução do processo?\",\"Quais funções e cargos específicos são exigidos para a operação?\",\"A equipe alocada possui as competências necessárias para as atividades mapeadas?\",\"Quais equipamentos e sistemas são utilizados durante o processo?\",\"As ferramentas tecnológicas disponíveis atendem à demanda das atividades?\",\"O processo é manual ou automatizado por algum software específico?\",\"Qual o objetivo principal desse processo?\",\"Existem melhorias propostas ou já em andamento?\",\"O processo atual atende plenamente à sua finalidade estratégica?\",\"Quais indicadores (quantitativos) são utilizados para apuração de resultados?\",\"Como mensuramos o sucesso ou fracasso dessa operação?\",\"Os indicadores atuais refletem a realidade da eficiência do processo?\",\"Quais os controles utilizados para o acompanhamento do processo?\",\"Como garantimos a padronização e evitamos desvios na execução?\",\"A frequência de controle é adequada à criticidade do processo?\"],\"cuidados\":[\"Preparação e Contextualização — Levantamento Prévio: Antes da reunião, solicite ou pesquise se já existem documentos sobre o processo (POPs antigos, manuais ou fluxogramas).\",\"Validação da Realidade (Real vs. Ideal) — Foco no \\\"As-Is\\\" (Como É): Questione sempre: \\\"Isso acontece 100% das vezes ou é o cenário ideal?\\\".\",\"Atenção às Incongruências Comuns — Nível de Detalhe: Evite listar microtarefas (ex: \\\"clicar no botão salvar\\\").\",\"Visão Sistêmica e Escrita — Interconexão: Entenda que os quadrantes não são gavetas isoladas; \\\"nada está solto\\\".\",\"Dinâmica da Dupla de Consultoria Para otimizar a reunião e não perder informações, divida os papéis — Consultor A: Fica responsável por apresentar a ferramenta (BMC), conduzir a dinâmica e fazer as perguntas assertivas.\",\"A Regra do 80/20 (Foco na Regra, não na Exceção) — Mapeie o fluxo padrão: O PMMC deve retratar o que acontece na maioria das vezes.\"],\"exemplos\":null,\"anexos\":[{\"nome\":\"[CIEP] Metodologia - PMMC.pdf\",\"tipo\":\"Metodologia (PDF)\",\"descricao\":\"Metodologia completa: os 10 blocos, perguntas-chave e recomendações de condução.\",\"versao\":\"v1.0\",\"data\":\"2026-09-07\",\"driveId\":\"16uPvXjSdmn7cvs0udVo13O4xq8cVgpQr\",\"url\":\"https://drive.google.com/file/d/16uPvXjSdmn7cvs0udVo13O4xq8cVgpQr/view\"},{\"nome\":\"[CIEP] Process Map Model Canvas.pdf\",\"tipo\":\"Modelo padrão\",\"descricao\":\"Canvas em branco com os 10 blocos e a pergunta-guia de cada um.\",\"versao\":\"v1.0\",\"data\":\"2026-09-07\",\"driveId\":\"1sfzv1hNxzuRhD0NDe9ekpxfNE2EDsqOB\",\"url\":\"https://drive.google.com/file/d/1sfzv1hNxzuRhD0NDe9ekpxfNE2EDsqOB/view\"},{\"nome\":\"Banco de Indicadores\",\"tipo\":\"Planilha\",\"descricao\":\"139 indicadores por escopo, com fórmula e método, para o bloco Indicadores de Performance.\",\"versao\":\"v1.0\",\"data\":\"2026-09-07\",\"driveId\":\"1bvEJGCUH_P8-vDykANXbYY-MMpdFt7d8j6TBDM7Kb2A\",\"url\":\"https://docs.google.com/spreadsheets/d/1bvEJ e são retirados os insumos envolvidos no processo?\"},{\"titulo\":\"Principais Insumos\",\"gc\":\"2 / 3\",\"gr\":\"1 / 2\",\"dica\":\"Inputs (físicos ou de ordem intelectual) que serão processados até o resultado final.\"},{\"titulo\":\"Principais Atividades\",\"gc\":\"3 / 4\",\"gr\":\"1 / 2\",\"dica\":\"Quais atividades são desempenhadas desde o repasse dos insumos até a finalização da proposta de valor?\"},{\"titulo\":\"Principais Produtos\",\"gc\":\"4 / 5\",\"gr\":\"1 / 2\",\"dica\":\"Informações de saída resultantes do processo (resultados).\"},{\"titulo\":\"Principais Clientes\",\"gc\":\"5 / 6\",\"gr\":\"1 / 2\",\"dica\":\"Beneficiários do processo. Aqueles a quem o produto é destinado.\"},{\"titulo\":\"Recursos Humanos\",\"gc\":\"1 / 3\",\"gr\":\"2 / 3\",\"dica\":\"Quem e quantos são responsáveis pelo processo? Funções e cargos podem ser importantes.\"},{\"titulo\":\"Recursos Tecnológicos\",\"gc\":\"3 / 4\",\"gr\":\"2 / 3\",\"dica\":\"Equipamentos e sistemas utilizados.\"},{\"titulo\":\"Finalidade e Melhorias\",\"gc\":\"4 / 6\",\"gr\":\"2 / 3\",\"dica\":\"Qual o objetivo desse processo? Existem melhorias propostas ou em andamento?\"},{\"titulo\":\"Indicadores de Performance\",\"gc\":\"1 / 3\",\"gr\":\"3 / 4\",\"dica\":\"Indicadores (quantitativos) utilizados para apuração de resultados na empresa.\"},{\"titulo\":\"Ferramentas de Controle\",\"gc\":\"3 / 6\",\"gr\":\"3 / 4\",\"dica\":\"Quais os controles utilizados para o acompanhamento do processo?\"}]}},{\"id\":\"porter\",\"nome\":\"5 Forças de Porter\",\"tipo\":\"Ferramenta\",\"categoria\":\"Entendimento\",\"complexidade\":\"Médio\",\"tempo\":\"2–3h\",\"status\":\"Em revisão\",\"freq\":\"Média\",\"responsavel\":{\"nome\":\"Gabriela Palma\",\"email\":\"gabrielapalma@produtivajunior.com.br\"},\"atualizado\":\"2026-09-07\",\"descricao\":\"O modelo das 5 Forças de Porter é uma estrutura de análise da competitividade setorial que examina cinco fatores chave do ambiente externo, determinando como o valor econômico é dividido entre os atores de uma empresa.\",\"objetivo\":\"Em suma, a ferramenta serve para dissecar o ambiente competitivo de empresas já atuantes no mercado, provendo insights sobre pressões externas que afetam a rentabilidade e embasando decisões estratégicas fundamentadas.\",\"problema\":null,\"quandoUsar\":null,\"quandoNao\":null,\"entradas\":[\"Dados do setor: concorrentes, fornecedores, clientes, substitutos\",\"Entrevista com o gestor sobre o mercado\"],\"saidas\":[\"Nota de intensidade de cada força\",\"Leitura da atratividade do setor para o planejamento\"],\"passos\":[\"Analise as questões determinantes: cada força tem questões padrões específicas que ajudam  — a determinar a intensidade dessa força no mercado.\",\"Atribuição de notas de 0 a 5 — Para cada uma dessas questões, você vai atribuir uma nota de 0 a 5, conforme a intensidade da força: 5 = Muito Alta, 4 = Alta, 3 = Média, 2 = Baixa, 1 = Muito Baixa, 0 = Zero. *Quando uma força recebe alta pontuação significa dizer que ela é uma grande ameaça para a organização, então vamos inverter a nota quando a questão determinante for favorável à empresa, ou seja: Se o fator determinante for favorável a capacidade de combater a ameaça (ex.: “grau de desenvolvimento de novos produtos/serviços pela empresa”) iremos inverter a nota... seguindo essa lógica se der “Muito Alta” significa que a empresa tem alta capacidade de combater produtos substitutos, então ao invés de atribuirmos a nota 5, iremos inverter e atribuir a nota 0.\",\"Cálculo das — Médias: depois de atribuir notas para cada questão determinante em cada uma das 5 forças, você deve calcular a média das notas de cada força para ver qual delas tem maior impacto na empresa.\",\"Resumo das análises: por fim, traga de forma visual em um quadro um resumo das análises fe — itas, este resumo visual ajuda a compartilhar os insights de maneira clara e objetiva, facilitando a tomada de decisões estratégicas.\"],\"perguntas\":null,\"cuidados\":null,\"exemplos\":null,\"anexos\":[{\"nome\":\"Metodologia - 5 Forças de Porter.pdf\",\"tipo\":\"Metodologia (PDF)\",\"descricao\":\"Definição, as 5 forças com 'como coletar', construção e modelo padrão.\",\"versao\":\"v1.0\",\"data\":\"2026-09-07\",\"driveId\":\"1_GkfmjPhdLa2lZl9lH3e5izPDvRJpe1h\",\"url\":\"https://drive.google.com/file/d/1_GkfmjPhdLa2lZl9lH3e5izPDvRJpe1h/view\"},{\"nome\":\"Modelo - 5 Forças de Porter.pdf\",\"tipo\":\"Modelo padrão\",\"descricao\":\"Diagrama das 5 forças com as perguntas-guia.\",\"versao\":\"v1.0\",\"data\":\"2026-09-07\",\"driveId\":\"19FF6AvSQ5YzYieFjahDTW5ShIX9h3qCq\",\"url\":\"https://drive.google.com/file/d/19FF6AvSQ5YzYieFjahDTW5ShIX9h3qCq/view\"},{\"nome\":\"Modelo Padrão - 5 Forças de Porter\",\"tipo\":\"Planilha\",\"descricao\":\"Planilha com questões determinantes, avaliação e nota por força, e gráfico.\",\"versao\":\"v1.0\",\"data\":\"2026-09-07\",\"driveId\":\"1qAOzFsggrbdFxKPkart9UxX7YacHL1AnvCSMKTJLwOY\",\"url\":\"https://docs.google.com/spreadsheets/d/1qAOzFsggrbdFxKPkart9UxX7YacHL1AnvCSMKTJLwOY/edit\"}],\"fontes\":[{\"tipo\":\"drive-pdf\",\"id\":\"1_GkfmjPhdLa2lZl9lH3e5izPDvRJpe1h\",\"nome\":\"Metodologia - 5 Forças de Porter.pdf\",\"hash\":\"122911069556e09f569ad1dc761263b655c0cddaf9d72482996ddb03c87d4dc5\"},{\"tipo\":\"drive-pdf\",\"id\":\"19FF6AvSQ5YzYieFjahDTW5ShIX9h3qCq\",\"nome\":\"Modelo - 5 Forças de Porter.pdf\",\"hash\":\"775c063ce9e032dd33ddc45e2355dbdaa595d8bb28fb6543f9d097c9c8d1ca00\"},{\"tipo\":\"drive-sheet\",\"id\":\"1qAOzFsggrbdFxKPkart9UxX7YacHL1AnvCSMKTJLwOY\",\"nome\":\"Modelo Padrão - 5 Forças de Porter\",\"hash\":\"c0d9ccc25dc2f1021f9401ac0b65aa203aadbbc2bf10587845de8e85368e27f0\"}],\"origem\":{\"nome\":\"manual:gabrielapalma@produtivajunior.com.br\",\"tipo\":\"manual:gabrielapalma@produtivajunior.com.br\",\"categoria\":\"manual:gabrielapalma@produtivajunior.com.br\",\"complexidade\":\"manual:gabrielapalma@produtivajunior.com.br\",\"tempo\":\"manual:gabrielapalma@produtivajunior.com.br\",\"freq\":\"manual:gabri cesso antes de fluxogramar.\",\"objetivo\":\"\",\"problema\":\"\",\"quandoUsar\":[],\"quandoNao\":[],\"entradas\":[],\"saidas\":[],\"passos\":[],\"perguntas\":[],\"cuidados\":[],\"exemplos\":[],\"anexos\":[],\"fontes\":[{\"tipo\":\"manual\",\"id\":\"carloseduardo@produtivajunior.com.br\",\"nome\":\"Stub: sem arquivo-fonte no Drive\",\"hash\":null}],\"origem\":{\"nome\":\"manual:carloseduardo@produtivajunior.com.br\",\"tipo\":\"manual:carloseduardo@produtivajunior.com.br\",\"categoria\":\"manual:carloseduardo@produtivajunior.com.br\",\"complexidade\":\"manual:carloseduardo@produtivajunior.com.br\",\"tempo\":\"manual:carloseduardo@produtivajunior.com.br\",\"freq\":\"manual:carloseduardo@produtivajunior.com.br\",\"responsavel\":\"manual:carloseduardo@produtivajunior.com.br\",\"descricao\":\"manual:carloseduardo@produtivajunior.com.br\",\"anexos\":\"manual:carloseduardo@produtivajunior.com.br\"},\"pendencias\":[\"Só existe PDF avulso aplicado em cliente (SIPOC.pdf); falta metodologia e modelo padrão.\"],\"revisao\":{\"status\":\"rascunho\",\"revisor\":null,\"data\":null}},{\"id\":\"swot\",\"nome\":\"Matriz SWOT\",\"tipo\":\"Ferramenta\",\"categoria\":\"Entendimento\",\"complexidade\":\"Médio\",\"tempo\":\"Qualitativa 1–2h · Quantitativa +2h\",\"status\":\"Em revisão\",\"freq\":\"Alta\",\"responsavel\":{\"nome\":\"Gabriela Palma\",\"email\":\"gabrielapalma@produtivajunior.com.br\"},\"atualizado\":\"2026-09-07\",\"descricao\":\"A Matriz SWOT é uma ferramenta de análise estratégica utilizada para compreender o ambiente interno e externo de uma organização, projeto ou até mesmo uma pessoa.\",\"objetivo\":\"Essa matriz permite uma visão clara da situação atual, facilitando o planejamento estratégico e a tomada de decisões, ao alinhar as forças e fraquezas internas com as oportunidades e ameaças externas.\",\"problema\":null,\"quandoUsar\":[\"A construção da matriz SWOT traz uma visão clara da empresa, transformando percepções em dados para decisões mais assertivas\",\"Principais benefícios: Visão clara da empresa, com mapeamento dos fatores internos e externos\",\"Diagnóstico preciso, saindo da percepção subjetiva e indo para dados concretos\",\"Priorização estratégica, identificando quais forças, fraquezas, oportunidades e ameaças são mais relevantes\",\"Melhor tomada de decisão, baseada em dados e não apenas em opiniões\",\"Uso eficiente de recursos, focando no que realmente importa\"],\"quandoNao\":null,\"entradas\":[\"Entrevistas com participantes de níveis e áreas diferentes\",\"Dados secundários sobre mercado e concorrência\"],\"saidas\":[\"Matriz SWOT qualitativa validada\",\"Matriz quantitativa com priorização e cenário estratégico\"],\"passos\":[\"Seleção dos participantes — A coleta de dados para a matriz SWOT deve ser feita com pessoas que possuam visões complementares sobre a organização.\",\"Coleta de informações — Estrutura das Entrevistas As entrevistas podem ser realizadas de forma individual ou em pequenos grupos, conforme a realidade da empresa e o nível de aprofundamento desejado.\",\"Organização dos dados e validação — Após as entrevistas, todas as respostas devem ser organizadas e agrupadas.\",\"Priorização dos pontos — Ainda na fase qualitativa, pode-se realizar uma priorização inicial dos itens, baseada na frequência das citações, no consenso entre os participantes ou na percepção de impacto.\",\"Estruturação do cruzamento — Monte uma matriz cruzada, onde os elementos de cada quadrante são correlacionados com os elementos dos quadrantes opostos e relacionados.\",\"Atribuição de pesos — Cada interação entre os elementos deve ser avaliada atribuindo um peso de acordo com o grau de influência que um fator exerce sobre o outro.\",\"Interpretação dos resultados — Na soma, quanto maior o valor, maior é o impacto daquele fator (força ou fraqueza) no contexto externo, indicando quais elementos internos demandam mais atenção, seja para serem fortalecidos (no caso das forças) ou mitigados (no caso das fraquezas).\",\"Ordenação e priorização — A priorização dos itens na Matriz SWOT Quantitativa não segue uma única lógica.\",\"O que são os cenários? Os cenários estratégicos na — SWOT Quantitativa são combinações dos fatores internos (Forças e Fraquezas) com os fatores externos (Oportunidades e Ameaças).\",\"Quais são os cenários?\",\"Cálculo da pontuação total — A Pontuação Total é a soma de todos os valores preenchidos naquela matriz de cruzamento específica.\",\"Cálculo da pontuação máxima — A Pontuação Máxima corresponde ao cenário hipotético em que todas as interações possíveis são máximas, ou seja, todas com peso 2.\",\"Cálculo da porcentagem de cada cenário — A porcentagem serve para padronizar a comparação dos cenários, independentemente da quantidade de itens em cada quadrante.\",\"Interpretação dos cenários — De acordo com as porcentagens, será definido em qual cenário aquela organização se encontra, para que a partir disso, seja possível traçar um planejamento estratégico assertivo.\"],\"perguntas\":[\"Quais são nossos maiores diferenciais?\",\"O que fazemos muito bem?\",\"Quais competências, recursos ou processos são reconhecidos como pontos fortes?\",\"O que os clientes costumam elogiar?\"],\"cuidados\":null,\"exemplos\":[\"SWOT Quantitativa Referência: SWOT Qualitativa Referência\"],\"anexos\":[{\"nome\":\"Metodologia - SWOT.pdf\",\"tipo\":\"Metodologia (PDF)\",\"descricao\":\"Definição, SWOT qualitativa e quantitativa, roteiro de perguntas e cenários estratégicos.\",\"versao\":\"v1.0\",\"data\":\"2026-09-07\",\"driveId\":\"1S9KfYVHM3LDkz8DJLvsn1SJ76GwjX4R8\",\"url\":\"https://drive.google.com/file/d/1S9KfYVHM3LDkz8DJLvsn1SJ76GwjX4R8/view\"},{\"nome\":\"[SWOT] Modelo padrão.pdf\",\"tipo\":\"Modelo padrão\",\"descricao\":\"Matriz em branco com os 4 quadrantes.\",\"versao\":\"v1.0\",\"data\":\"2026-09-07\",\"driveId\":\"1-Y_mYRGz1ZxiVVAK1_WyMlZFYjUBjGf7\",\"url\":\"https://drive.google.com/file/d/1-Y_mYRGz1ZxiVVAK1_WyMlZFYjUBjGf7/view\"},{\"nome\":\"Matriz SWOT Quantitativa "registrado\":\"Extraído do Modelo Padrão\",\"blocos\":[{\"titulo\":\"Principais Fornecedores\",\"gc\":\"1 / 2\",\"gr\":\"1 / 2\",\"dica\":\"De onde são retirados os insumos envolvidos no processo?\"},{\"titulo\":\"Principais Insumos\",\"gc\":\"2 / 3\",\"gr\":\"1 / 2\",\"dica\":\"Inputs (físicos ou de ordem intelectual) que serão processados até o resultado final.\"},{\"titulo\":\"Principais Atividades\",\"gc\":\"3 / 4\",\"gr\":\"1 / 2\",\"dica\":\"Quais atividades são desempenhadas desde o repasse dos insumos até a finalização da proposta de valor?\"},{\"titulo\":\"Principais Produtos\",\"gc\":\"4 / 5\",\"gr\":\"1 / 2\",\"dica\":\"Informações de saída resultantes do processo (resultados).\"},{\"titulo\":\"Principais Clientes\",\"gc\":\"5 / 6\",\"gr\":\"1 / 2\",\"dica\":\"Beneficiários do processo. Aqueles a quem o produto é destinado.\"},{\"titulo\":\"Recursos Humanos\",\"gc\":\"1 / 3\",\"gr\":\"2 / 3\",\"dica\":\"Quem e quantos são responsáveis pelo processo? Funções e cargos podem ser importantes.\"},{\"titulo\":\"Recursos Tecnológicos\",\"gc\":\"3 / 4\",\"gr\":\"2 / 3\",\"dica\":\"Equipamentos e sistemas utilizados.\"},{\"titulo\":\"Finalidade e Melhorias\",\"gc\":\"4 / 6\",\"gr\":\"2 / 3\",\"dica\":\"Qual o objetivo desse processo? Existem melhorias propostas ou em andamento?\"},{\"titulo\":\"Indicadores de Performance\",\"gc\":\"1 / 3\",\"gr\":\"3 / 4\",\"dica\":\"Indicadores (quantitativos) utilizados para apuração de resultados na empresa.\"},{\"titulo\":\"Ferramentas de Controle\",\"gc\":\"3 / 6\",\"gr\":\"3 / 4\",\"dica\":\"Quais os controles utilizados para o acompanhamento do processo?\"}]},{\"id\":\"porter\",\"toolId\":\"porter\",\"nome\":\"5 Forças de Porter\",\"sigla\":\"5F\",\"fonte\":{\"driveId\":\"19FF6AvSQ5YzYieFjahDTW5ShIX9h3qCq\",\"nome\":\"Modelo - 5 Forças de Porter.pdf\"},\"layout\":\"grid\",\"registrado\":\"Extraído do Modelo Padrão\",\"blocos\":[{\"titulo\":\"Rivalidade entre os concorrentes\",\"dica\":\"Quantos concorrentes, com que intensidade disputam preço e cliente.\"},{\"titulo\":\"Poder de barganha dos fornecedores\",\"dica\":\"Quantos fornecedores existem e quanto ditam preço e prazo.\"},{\"titulo\":\"Poder de barganha dos clientes\",\"dica\":\"Quanto os clientes pressionam preço e condições.\"},{\"titulo\":\"Ameaça de novos entrantes\",\"dica\":\"Barreiras de entrada e facilidade de novos concorrentes surgirem.\"},{\"titulo\":\"Ameaça de produtos substitutos\",\"dica\":\"Alternativas que resolvem a mesma necessidade do cliente.\"}]},{\"id\":\"swot\",\"toolId\":\"swot\",\"nome\":\"Matriz SWOT\",\"sigla\":\"SWOT\",\"fonte\":{\"driveId\":\"1-Y_mYRGz1ZxiVVAK1_WyMlZFYjUBjGf7\",\"nome\":\"[SWOT] Modelo padrão.pdf\"},\"layout\":\"canvas\",\"registrado\":\"Extraído do Modelo Padrão\",\"blocos\":[{\"titulo\":\"Forças\",\"gc\":\"1 / 2\",\"gr\":\"1 / 2\",\"dica\":\"Fatores internos positivos que a empresa controla.\"},{\"titulo\":\"Fraquezas\",\"gc\":\"2 / 3\",\"gr\":\"1 / 2\",\"dica\":\"Fatores internos negativos que a empresa controla.\"},{\"titulo\":\"Oportunidades\",\"gc\":\"1 / 2\",\"gr\":\"2 / 3\",\"dica\":\"Fatores externos favoráveis, fora do controle da empresa.\"},{\"titulo\":\"Ameaças\",\"gc\":\"2 / 3\",\"gr\":\"2 / 3\",\"dica\":\"Fatores externos desfavoráveis, fora do controle da empresa.\"}]}],\"documentoPadrao\":{\"type\":\"metodologia\",\"nome\":\"Process Map Model Canvas\",\"sigla\":\"PMMC\",\"subtitulo\":\"Mapeamento e redesenho de processos\",\"categoria\":\"Processos\",\"fonte\":{\"driveId\":\"16uPvXjSdmn7cvs0udVo13O4xq8cVgpQr\",\"nome\":\"[CIEP] Metodologia - PMMC.pdf\"},\"intro\":\"O Process Map Model Canvas (PMMC) é uma ferramenta visual projetada para simplificar a análise e o redesenho de processos. Funcionando como um guia prático, ele condensa em uma única página os 10 blocos essenciais que compõem o fluxo de valor, garantindo uma visão sistêmica e facilitando a validação do entendimento junto ao gestor.\\nBaseada na lógica da Cadeia de Valor, a metodologia investiga a relação entre entradas, transformações e saídas. O objetivo é assegurar que a coleta de informações, idealmente realizada via brainstorming, seja padronizada e assertiva, servindo de base sólida para diagnósticos e melhorias operacionais.\",\"secoes\":[{\"grupo\":\"Entradas\",\"titulo\":\"Principais Fornecedores\",\"descricao\":\"Este é o ponto de partida lógico do mapeamento. O quadrante define a origem dos recursos que alimentarão o processo, identificando quem são os responsáveis por entregar o que é necessário para a operação começar.\\nEm um mapa de processos, o \\\"fornecedor\\\" não é necessariamente outra empresa; pode ser um departamento interno, uma etapa anterior do fluxo ou um parceiro externo.\",\"perguntas\":[\"De onde são retirados os insumos envolvidos no processo?\",\"O fornecedor é externo (outra empresa) ou interno (outro setor/processo)?\",\"Quem é o responsável direto por disponibilizar o recurso no tempo certo?\"]},{\"grupo\":\"Entradas\",\"titulo\":\"Principais Insumos\",\"descricao\":\"Os insumos representam a \\\"matéria-prima\\\" do processo. São todos os elementos, tangíveis (físicos) ou intangíveis (dados, informações, ordens intelectuais), que entram no fluxo para serem consumidos ou modificados até se tornarem o resultado final.\\nSe o fornecedor é \\\"quem entrega\\\", o insumo é \\\"o que é entregue\\\".\",\"perguntas\":[\"Quais são os inputs (físicos ou intelectuais) que serão processados?\",\"O que é indispensável receber para que a atividade possa começar?\",\"Os insumos chegam no padrão ou formato correto para serem utilizados?\"]},{\"grupo\":\"Processos\",\"titulo\":\"Principais Atividades\",\"descricao\":\"Este é o motor da operação. O quadrante de Atividades descreve o conjunto de ações e tarefas que devem ser executadas para transformar os insumos mapeados anteriormente nos produtos finais desejados.\\nNão é necessário listar cada micromovimento, mas sim as etapas macro que agregam valor e são essenciais para o fluxo. É a resposta para \\\"como o trabalho é feito\\\".\",\"perguntas\":[\"Quais atividades são desempenhadas desde o repasse dos insumos até a finalização da proposta de valor?\",\"Quais são as etapas críticas de transformação que não podem faltar?\",\"Existe uma sequência lógica clara entre as ações listadas?\"]},{\"grupo\":\"Saídas\",\"titulo\":\"Principais Produtos\",\"descricao\":\"Os produtos são a materialização do valor gerado pelas atividades. Eles representam a entrega final do fluxo analisado, sendo o resultado direto da transformação dos insumos.\\nÉ fundamental descrever com clareza o que está sendo entregue, seja um objeto físico, um relatório, um serviço concluído ou uma informação processada.\",\"perguntas\":[\"Quais são as informações de saída ou resultados tangíveis resultantes do processo?\",\"O que é efetivamente entregue ao final das atividades listadas?\",\"O produto atende aos requisitos de qualidade esperados?\"]},{\"grupo\":\"Saídas\",\"titulo\":\"Principais Clientes\",\"descricao\":\"Nenhum processo existe sem um propósito ou um destinatário. Este quadrante identifica quem recebe o produto mapeado anteriormente.\\nAssim como nos fornecedores, o cliente aqui pode ser externo (o consumidor final da empresa) ou interno (o próximo departamento, setor ou funcionário que precisa desse produto para realizar o seu trabalho).\",\"perguntas\":[\"Quem são os beneficiários do processo?\",\"Para quem o produto é destinado?\",\"O cliente é o consumidor final ou uma etapa posterior interna?\"]},{\"grupo\":\"Suporte\",\"titulo\":\"Recursos Humanos\",\"descricao\":\"Este quadrante foca nas pessoas. Aqui, identificamos quem são os agentes necessários para executar as atividades descritas anteriormente. Não se trata apenas de listar nomes, mas de entender a capacidade operacional e as competências exigidas.\\nÉ essencial definir funções e cargos para entender a estrutura de dependência humana do processo.\",\"perguntas\":[\"Quem e quantos são os responsáveis pela execução do processo?\",\"Quais funções e cargos específicos são exigidos para a operação?\",\"A equipe alocada possui as competências necessárias para as atividades mapeadas?\"]},{\"grupo\":\"Suporte\",\"titulo\":\"Recursos Tecnológicos\",\"descricao\":\"Além das pessoas, a maioria dos processos modernos depende de uma base tecnológica para funcionar. Este quadrante mapeia as ferramentas não humanas, sejam softwares, sistemas de gestão (ERPs), máquinas ou equipamentos físicos, que dão suporte à realização das atividades.\\nIdentificar esses recursos é vital para entender o nível de automação do processo e se a infraestrutura atual é um facilitador ou um gargalo.\",\"perguntas\":[\"Quais equipamentos e sistemas são utilizados durante o processo?\",\"As ferramentas tecnológicas disponíveis atendem à demanda das atividades?\",\"O processo é manual ou automatizado por algum software específico?\"]},{\"grupo\":\"Suporte\",\"titulo\":\"Finalidade e Melhorias\",\"descricao\":\"Este bloco conecta a operação à estratégia. Não basta executar; é preciso saber o \\\"porquê\\\". Aqui define-se o propósito central da existência daquele processo e se ele está estático ou em evolução.\\nEntender a finalidade evita a manutenção de processos obsoletos que não agregam mais valor. Mapear as melhorias em andamento (ou propostas) dá a visão de futuro.\",\"perguntas\":[\"Qual o objetivo principal desse processo?\",\"Existem melhorias propostas ou já em andamento?\",\"O processo atual atende plenamente à sua finalidade estratégica?\"]},{\"grupo\":\"Controle\",\"titulo\":\"Indicadores de Performance\",\"descricao\":\"\\\"O que não é medido não é gerenciado\\\". Este quadrante é dedicado aos KPIs. Aqui devem constar as métricas quantitativas utilizadas para apurar se os resultados esperados estão sendo alcançados.\\nOs indicadores mostram \\\"quão bem\\\" o processo rodou (tempo, custo, qualidade, taxa de erro). O Banco de Indicadores da Produtiva ajuda na elaboração deste bloco.\",\"perguntas\":[\"Quais indicadores (quantitativos) são utilizados para apuração de resultados?\",\"Como mensuramos o sucesso ou fracasso dessa operação?\",\"Os indicadores atuais refletem a realidade da eficiência do processo?\"]},{\"grupo\":\"Controle\",\"titulo\":\"Ferramentas de Controle\",\"descricao\":\"Para fechar o canvas, temos a governança. As ferramentas de controle são os mecanismos utilizados para acompanhar, fiscalizar e garantir que o processo siga o padrão estabelecido.\\nEnquanto os Recursos Tecnológicos ajudam a fazer, as Ferramentas de Controle ajudam a monitorar: checklists, planilhas de acompanhamento, reuniões de status, auditorias ou dashboards de gestão visual.\",\"perguntas\":[\"Quais os controles utilizados para o acompanhamento do processo?\",\"Como garantimos a padronização e evitamos desvios na execução?\",\"A frequência de controle é adequada à criticidade do processo?\"]}],\"blocos\":[{\"titulo\":\"Principais Fornecedores\",\"itens\":[\"Origem dos recursos\",\"Interno ou externo\",\"Responsável por disponibilizar\"],\"w\":\"normal\"},{\"titulo\":\"Principais Insumos\",\"itens\":[\"Inputs físicos ou intelectuais\",\"Padrão e formato\"],\"w\":\"normal\"},{\"titulo\":\"Principais Atividades\",\"itens\":[\"Etapas macro de transformação\",\"Sequência lógica\"],\"w\":\"wide\"},{\"titulo\":\"Principais Produtos\",\"itens\":[\"Entrega final do fluxo\",\"Requisitos de qualidade\"],\"w\":\"normal\"},{\"titulo\":\"Principais Clientes\",\"itens\":[\"Beneficiários\",\"Interno ou consumidor final\"],\"w\":\"normal\"},{\"titulo\":\"Recursos Humanos\",\"itens\":[\"Quem e quantos\",\"Funções e cargos\"],\"w\":\"normal\"},{\"titulo\":\"Recursos Tecnológicos\",\"itens\":[\"Sistemas e equipamentos\",\"Manual ou automatizado\"],\"w\":\"normal\"},{\"titulo\":\"Finalidade e Melhorias\",\"itens\":[\"Objetivo do processo\",\"Melhorias propostas ou em andamento\"],\"w\":\"normal\"},{\"titulo\":\"Indicadores de Performance\",\"itens\":[\"KPIs quantitativos\",\"Como medir sucesso\"],\"w\":\"normal\"},{\"titulo\":\"Ferramentas de Controle\",\"itens\":[\"Checklists, auditorias, dashboards\",\"Frequência de controle\"],\"w\":\"normal\"}]},\"cases\":[],\"trilha\":{\"passos\":[{\"id\":\"escopos\",\"titulo\":\"Entenda como um projeto é organizado\",\"texto\":\"Todo projeto da Produtiva tem 1 gerente e 2 consultores e segue um escopo: uma sequência de etapas, cada uma com ferramentas e entregáveis. Abra um escopo ativo e leia a linha do tempo antes de qualquer outra coisa.\",\"acao\":{\"tela\":\"escopos\",\"label\":\"Ver os escopos\"}},{\"id\":\"ferramentas\",\"titulo\":\"Conheça as ferramentas que aparecem em quase todo projeto\",\"texto\":\"A lista abaixo é calculada a partir dos escopos: são as ferramentas mapeadas em mais etapas. Abra cada uma e leia 'Quando usar' e o passo a passo.\",\"acao\":{\"tela\":\"biblioteca\",\"label\":\"Abrir a Biblioteca\"},\"listaFerramentas\":true},{\"id\":\"case\",\"titulo\":\"Leia um case parecido com o seu projeto\",\"texto\":\"Procure pelo segmento do cliente ou pelo escopo. Veja os resultados, os aprendizados e o vídeo da equipe. Se ficar dúvida, use 'Pergunte a quem fez' na ficha do case.\",\"acao\":{\"tela\":\"cases\",\"label\":\"Ver os cases\"}},{\"id\":\"reuniao\",\"titulo\":\"Prepare a reunião com o cliente\",\"texto\":\"Na ficha de qualquer ferramenta, 'Material para a reunião' gera uma versão para imprimir: perguntas-chave com espaço para anotar, passo a passo e, quando existe, o canvas em branco.\",\"acao\":{\"tela\":\"biblioteca\",\"label\":\"Escolher uma ferramenta\"}},{\"id\":\"siglas\",\"titulo\":\"Aprenda as siglas que todo mundo usa\",\"texto\":\"O glossário abaixo reúne o que aparece nos cronogramas, nos escopos e nas conversas. Termos marcados 'a confirmar' ainda não têm definição oficial do CIEP.\",\"acao\":null},{\"id\":\"registrar\",\"titulo\":\"Ao fechar o projeto, registre o case\",\"texto\":\"Leva uns 15 minutos: história, resultados, ferramentas usadas, documentos, foto e o vídeo da equipe. É o que vai ajudar o próximo consultor a fazer um projeto parecido.\",\"acao\":{\"tela\":\"novo-case\",\"label\":\"Cadastrar um case\"}}],\"glossario\":[{\"sigla\":\"Escopo\",\"nome\":null,\"definicao\":\"Linha de serviço da Produtiva (ex.: Mapeamento e Modelagem de Processos). Cada escopo é uma sequência de etapas com ferramentas e entregáveis. Os 'ativos' são os vendidos hoje; os 'despriorizados' seguem documentados.\",\"origem\":\"drive:1jeY1obf5wl2w_LRxfKQhU3mnuj6V6_MJZ8XfV4hXTGE\",\"pendente\":false},{\"sigla\":\"Etapa\",\"nome\":null,\"definicao\":\"Bloco de trabalho dentro de um escopo, na ordem em que o projeto acontece (Iniciação, Mapeamento, Finalização…). Cada etapa tem duração de referência no Cronograma Base.\",\"origem\":\"drive:1z773_kmhKUBwtE8kD4EdJIooz4_IgVDe9Vp0Ju0_9L0\",\"pendente\":false},{\"sigla\":\"Cronograma Base\",\"nome\":null,\"definicao\":\"Planilha-modelo de cada escopo com as etapas, a semana em que acontecem, os marcos e as ferramentas usadas. É a origem da linha do tempo mostrada na tela Escopos.\",\"origem\":\"drive:10VQNiyCgZbuoCLCCoUphE6AM_9Ntg_y-4sprsaopLeQ\",\"pendente\":false},{\"sigla\":\"Resumão dos escopos\",\"nome\":null,\"definicao\":\"Documento que lista as macroetapas de todos os escopos, ativos e despriorizados. Base do cadastro de escopos do Hangar.\",\"origem\":\"drive:1z773_kmhKUBwtE8kD4EdJIooz4_IgVDe9Vp0Ju0_9L0\",\"pendente\":false},{\"sigla\":\"RAC\",\"nome\":null,\"definicao\":\"Marco da etapa de Iniciação nos Cronogramas Base, ligado à coleta de informações com o cliente (aparece como 'RAC — Coleta de informações' na primeira semana). A expansão da sigla ainda precisa ser confirmada com o CIEP.\",\"origem\":\"drive:13K7E64nP_ReIf-u6WIQ0RUHRwvYxiTGwjYI3Hbxz8TE\",\"pendente\":true},{\"sigla\":\"RAF\",\"nome\":null,\"definicao\":\"Marco da etapa de Finalização nos Cronogramas Base, na última semana do projeto. A expansão da sigla ainda precisa ser confirmada com o CIEP.\",\"origem\":\"drive:13K7E64nP_ReIf-u6WIQ0RUHRwvYxiTGwjYI3Hbxz8TE\",\"pendente\":true},{\"sigla\":\"CIEP\",\"nome\":null,\"definicao\":\"Área da Produtiva responsável pelo acervo de ferramentas e metodologias. Aprova o conteúdo do Hangar e publica os cases enviados pelos membros.\",\"origem\":\"manual:produtivajunior@gmail.com\",\"pendente\":true},{\"sigla\":\"Gerente e consultores\",\"nome\":null,\"definicao\":\"A equipe padrão de um projeto: 1 gerente e 2 consultores. É assim que o case registra a equipe.\",\"origem\":\"manual:produtivajunior@gmail.com\",\"pendente\":false},{\"sigla\":\"Case\",\"nome\":null,\"definicao\":\"Registro de um projeto finalizado: cliente, escopo, equipe, história, resultados, documentos, foto e vídeo. Fica no Banco de Cases para servir de referência.\",\"origem\":\"manual:produtivajunior@gmail.com\",\"pendente\":false},{\"sigla\":\"Map e Mod\",\"nome\":\"Mapeamento e Modelagem de Processos\",\"definicao\":\"Escopo de Produção: entende o macroprocesso, mapeia os processos AS IS, aponta causas raízes e modela os processos TO BE, deixando rotina, DCO e manual do setor implantados.\",\"origem\":\"drive:1z773_kmhKUBwtE8kD4EdJIooz4_IgVDe9Vp0Ju0_9L0\",\"pendente\":false},{\"sigla\":\"AS IS / TO BE\",\"nome\":\"Como é / Como deve ser\",\"definicao\":\"Os dois retratos de um processo no Map e Mod: como ele funciona hoje (AS IS) e como deve funcionar depois da modelagem (TO BE).\",\"origem\":\"drive:1z773_kmhKUBwtE8kD4EdJIooz4_IgVDe9Vp0Ju0_9L0\",\"pendente\":false},{\"sigla\":\"DCO\",\"nome\":null,\"definicao\":\"Entregável da etapa final do Map e Mod, implantado junto com a rotina e o manual do setor. A expansão da sigla ainda precisa ser confirmada com o CIEP.\",\"origem\":\"drive:1z773_kmhKUBwtE8kD4EdJIooz4_IgVDe9Vp0Ju0_9L0\",\"pendente\":true},{\"sigla\":\"PCP\",\"nome\":\"Planejamento e Controle da Produção\",\"definicao\":\"Escopo de Produção: entende e classifica o sistema de produção, mapeia e analisa tempos e entrega ferramenta de controle, programação e controle da produção.\",\"orige
