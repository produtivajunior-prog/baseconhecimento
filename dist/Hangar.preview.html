              <\u002Fdiv>\n                <\u002Fsc-if>\n                <!-- passo a passo numerado -->\n                <sc-if value=\"{{ bk.isSteps }}\" hint-placeholder-val=\"{{ false }}\">\n                  <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px\">\n                    <sc-for list=\"{{ bk.steps }}\" as=\"st\" hint-placeholder-count=\"4\">\n                      <li style=\"display:flex;gap:13px;align-items:flex-start\">\n                        <span style=\"flex:none;width:26px;height:26px;border-radius:8px;background:#EAF6F9;color:#1E7C92;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center\">{{ st.n }}<\u002Fspan>\n                        <span style=\"font-size:14.5px;color:#3C545B;line-height:1.5;padding-top:2px\">{{ st.text }}<\u002Fspan>\n                      <\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Fol>\n                <\u002Fsc-if>\n                <!-- lista simples -->\n                <sc-if value=\"{{ bk.isList }}\" hint-placeholder-val=\"{{ false }}\">\n                  <ul style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px\">\n                    <sc-for list=\"{{ bk.items }}\" as=\"li\" hint-placeholder-count=\"4\">\n                      <li style=\"display:flex;gap:10px;font-size:14.5px;color:#3C545B;line-height:1.5\"><span style=\"color:#3DAFC7;flex:none;margin-top:1px\">{{ bk.marker }}<\u002Fspan><span>{{ li }}<\u002Fspan><\u002Fli>\n                    <\u002Fsc-for>\n                  <\u002Ful>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <!-- Templates e anexos -->\n        <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:22px;margin-bottom:12px\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:16px\">\n            <h3 style=\"font-size:16px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">Templates e anexos<\u002Fh3>\n            <button onclick=\"{{ openSelAnexos }}\" style=\"border:none;background:transparent;color:#1E7C92;font-size:13.5px;font-weight:600;cursor:pointer\">Ver todos →<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ sel.anexos }}\" as=\"a\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex;align-items:center;gap:13px;padding:11px 14px;border:1px solid #EEF3F5;border-radius:11px\">\n                <span style=\"flex:none;width:38px;height:38px;border-radius:9px;background:{{ a.bg }};color:{{ a.color }};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:0.03em\">{{ a.ext }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:14px;font-weight:600;color:#163B45\">{{ a.nome }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#8AA0A7\">{{ a.tipo }} · {{ a.versao }} · {{ a.dataFmt }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button onclick=\"{{ a.abrir }}\" disabled=\"{{ a.semUrl }}\" style=\"flex:none;border:1px solid #DCE7EB;background:#fff;color:#1E7C92;font-size:13px;font-weight:600;padding:7px 13px;border-radius:8px;cursor:pointer\" style-hover=\"border-color:#9FD7E2\">{{ a.btnLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Aside: ficha + avaliação -->\n      <aside class=\"hg-aside\" style=\"position:sticky;top:88px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px\">\n          <div style=\"font-size:12px;font-weight:700;color:#9DAEB4;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:14px\">Ficha rápida<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:13px\">\n            <div style=\"display:flex;align-items:center;gap:11px\">\n              <div style=\"width:34px;height:34px;border-radius:50%;background:#163B45;color:#fff;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none\">{{ sel.respInitials }}<\u002Fdiv>\n              <div><div style=\"font-size:11px;color:#9DAEB4;font-weight:600\">Responsável<\u002Fdiv><div style=\"font-size:14px;font-weight:600;color:#163B45\">{{ sel.respNome }}<\u002Fdiv><div style=\"font-size:11.5px;color:#9DAEB4\">{{ sel.respEmail }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:13.5px;padding-top:13px;border-top:1px solid #F0F4F5\"><span style=\"color:#7C9097\">Última atualização<\u002Fspan><span style=\"font-weight:600;color:#163B45;white-space:nowrap;padding-left:14px;text-align:right\">{{ sel.atualizadoFmt }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-size:13.5px\"><span style=\"color:#7C9097\">Frequência de uso<\u002Fspan><span style=\"font-weight:600;color:#163B45;white-space:nowrap;padding-left:14px;text-align:right\">{{ sel.freq }}<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;gap:10px;font-size:13.5px\"><span style=\"color:#7C9097;flex:none\">Revisão<\u002Fspan><span style=\"font-weight:600;color:#163B45;text-align:right;line-height:1.35\">{{ sel.revisaoTexto }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ sel.hasAnexos }}\" hint-placeholder-val=\"{{ true }}\"><button onclick=\"{{ openSelAnexos }}\" style=\"width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;background:#3DAFC7;color:#fff;font-size:14px;font-weight:600;padding:11px;border-radius:10px;cursor:pointer\" style-hover=\"background:#2E9DB5\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M16 8l-6.5 6.5a3 3 0 004.2 4.2L21 12a5 5 0 00-7-7L6.5 12.5\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>Acessar anexos ({{ sel.anexosCount }})<\u002Fbutton><\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px\">\n          <div style=\"font-size:12px;font-weight:700;color:#9DAEB4;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px\">Para a reunião com o cliente<\u002Fdiv>\n          <p style=\"font-size:13px;color:#5E747B;margin:0 0 12px;line-height:1.5\">Uma página para imprimir: perguntas-chave com espaço para anotar, o que pedir ao cliente e o passo a passo<sc-if value=\"{{ sel.hasCanvas }}\" hint-placeholder-val=\"{{ false }}\">, mais o canvas em branco<\u002Fsc-if>.<\u002Fp>\n          <button onclick=\"{{ sel.abrirMaterial }}\" style=\"width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid #3DAFC7;background:#EAF6F9;color:#1E7C92;font-size:13.5px;font-weight:600;padding:10px;border-radius:10px;cursor:pointer\" style-hover=\"background:#DCF0F4\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M6 9V4h12v5M6 18H4a1 1 0 01-1-1v-6a1 1 0 011-1h16a1 1 0 011 1v6a1 1 0 01-1 1h-2M6 14h12v6H6z\" stroke=\"#1E7C92\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Abrir material para imprimir<\u002Fbutton>\n          <button onclick=\"{{ sel.baixarMaterial }}\" style=\"width:100%;margin-top:8px;border:1px solid #DCE7EB;background:#fff;color:#5E747B;font-size:13px;font-weight:600;padding:9px;border-radius:10px;cursor:pointer\" style-hover=\"border-color:#9FD7E2\">Baixar (.html)<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px\">\n          <div style=\"font-size:14px;font-weight:600;color:#163B45;margin-bottom:4px\">Esse conteúdo foi útil?<\u002Fdiv>\n          <p style=\"font-size:12.5px;color:#8AA0A7;margin:0 0 13px\">Sua avaliação ajuda o CIEP a manter a biblioteca relevante.<\u002Fp>\n          <sc-if value=\"{{ notRated }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;gap:8px\">\n              <button onclick=\"{{ rateUp }}\" style=\"flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #DCE7EB;background:#fff;color:#2E7D52;font-size:13.5px;font-weight:600;padding:10px;border-radius:10px;cursor:pointer\" style-hover=\"border-color:#9CD3B4;background:#F2FAF5\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M7 11v9H4a1 1 0 01-1-1v-7a1 1 0 011-1h3zm0 0l4.5-7a2 2 0 013.7 1.3L14.5 9H20a2 2 0 012 2.4l-1.4 7A2 2 0 0118.6 20H7\" stroke=\"#2E7D52\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Útil<\u002Fbutton>\n              <button onclick=\"{{ rateDown }}\" style=\"flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid #DCE7EB;background:#fff;color:#B23B47;font-size:13.5px;font-weight:600;padding:10px;border-radius:10px;cursor:pointer\" style-hover=\"border-color:#E6AFB5;background:#FCF3F4\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M17 13V4h3a1 1 0 011 1v7a1 1 0 01-1 1h-3zm0 0l-4.5 7a2 2 0 01-3.7-1.3L9.5 15H4a2 2 0 01-2-2.4l1.4-7A2 2 0 015.4 4H17\" stroke=\"#B23B47\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Nem tanto<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ rated }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#F2FAF5;border:1px solid #CFEBD9;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#2E7D52;font-weight:600;display:flex;align-items:center;gap:8px\">✓ Obrigado pelo feedback!<\u002Fdiv>\n          <\u002Fsc-if>\n          <textarea value=\"{{ feedback }}\" oninput=\"{{ onFeedbackInput }}\" placeholder=\"Sugestão de melhoria (opcional)…\" style=\"width:100%;margin-top:11px;border:1px solid #DCE7EB;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#172A30;resize:none;height:72px;outline:none\" style-focus=\"border-color:#9FD7E2\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <!-- Criar com IA: preencher a ferramenta -->\n        <div style=\"background:linear-gradient(155deg,#1B4651 0%,#28697A 100%);border-radius:16px;padding:20px;color:#fff\">\n          <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:6px\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"#7FD3E3\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:15px;font-weight:700;font-family:'Schibsted Grotesk'\">Criar com IA<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;color:#BFE2EA;margin:0 0 12px;line-height:1.5\">Cole os insumos do seu projeto e a IA devolve a <b style=\"color:#fff\">{{ applyToolName }}<\u002Fb> já preenchida para o seu caso.<\u002Fp>\n          <textarea value=\"{{ applyInputVal }}\" oninput=\"{{ setApplyInput }}\" placeholder=\"Ex.: cliente é uma padaria de bairro com 12 funcionários, faturamento estável, forte no atendimento mas sem presença digital, concorrência crescente de redes…\" style=\"width:100%;border:none;border-radius:10px;padding:11px 13px;font-size:13.5px;outline:none;resize:vertical;height:104px;line-height:1.5;color:#172A30\" style-focus=\"box-shadow:0 0 0 2px #7FD3E3\"><\u002Ftextarea>\n          <sc-if value=\"{{ hasApplyError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px;color:#FFD4D4;margin-top:8px;line-height:1.4\">{{ applyError }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <button onclick=\"{{ generateApply }}\" disabled=\"{{ applyLoading }}\" style=\"width:100%;margin-top:11px;display:flex;align-items:center;justify-content:center;gap:8px;border:none;background:#7FD3E3;color:#0C3540;font-size:14px;font-weight:700;padding:11px;border-radius:10px;cursor:pointer\" style-hover=\"background:#6AC7D9\">\n            <sc-if value=\"{{ applyLoading }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"width:15px;height:15px;border:2px solid rgba(12,53,64,0.35);border-top-color:#0C3540;border-radius:50%;display:inline-block;animation:ciepSpin .7s linear infinite\"><\u002Fspan>Preenchendo…\n            <\u002Fsc-if>\n            <sc-if value=\"{{ applyNotLoading }}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"#0C3540\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Gerar preenchida\n            <\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ MODAL FERRAMENTA PREENCHIDA (IA) ============ -->\n  <sc-if value=\"{{ applyOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div onclick=\"{{ closeApply }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(13,38,45,0.5);display:flex;align-items:center;justify-content:center;padding:24px;animation:ciepFade .15s ease\">\n    <div onclick=\"{{ stop }}\" class=\"ciep-scroll\" style=\"background:#fff;border-radius:18px;width:960px;max-width:100%;max-height:86vh;overflow:auto;animation:ciepPop .2s ease;box-shadow:0 30px 80px -30px rgba(13,38,45,0.5)\">\n      <div style=\"position:sticky;top:0;background:linear-gradient(150deg,#3DAFC7 0%,#1B6072 100%);padding:22px 26px;color:#fff;display:flex;align-items:flex-start;justify-content:space-between\">\n        <div>\n          <div style=\"display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:0.12em;color:#CDEDF4\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"#CDEDF4\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>PREENCHIDA COM IA<\u002Fdiv>\n          <h3 style=\"font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-0.01em\">{{ applyResultTitle }}<\u002Fh3>\n        <\u002Fdiv>\n        <button onclick=\"{{ closeApply }}\" style=\"border:none;background:rgba(255,255,255,0.18);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:18px;color:#fff;flex:none\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"padding:22px 26px 14px\">\n        <sc-if value=\"{{ hasApplyModelo }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:9px;background:#F4FBFC;border:1px solid #DCEDF1;border-radius:11px;padding:10px 14px;margin-bottom:16px\">\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"2.5\" stroke=\"#1E7C92\" stroke-width=\"1.6\"><\u002Frect><path d=\"M3.5 9.5h17M10 9.5V21\" stroke=\"#1E7C92\" stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:12.5px;color:#3C545B;line-height:1.4\">Preenchido no formato do modelo-padrão <b style=\"color:#1B6072;font-weight:600\">{{ applyModeloNome }}<\u002Fb> · lido de {{ applyModeloFonte }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Layout canvas (segue o modelo anexado, ex.: BMC) -->\n        <sc-if value=\"{{ applyIsCanvas }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:minmax(118px,auto);gap:8px\">\n            <sc-for list=\"{{ applyCanvasCells }}\" as=\"b\" hint-placeholder-count=\"9\">\n              <div style=\"grid-column:{{ b.gc }};grid-row:{{ b.gr }};border:1px solid #E0E8EA;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;background:#fff\">\n                <div style=\"background:#EAF6F9;padding:8px 11px;border-bottom:1px solid #DCEDF1\"><span style=\"font-size:11px;font-weight:700;color:#1B6072;letter-spacing:0.02em;text-transform:uppercase;line-height:1.2\">{{ b.titulo }}<\u002Fspan><\u002Fdiv>\n                <div style=\"padding:9px 11px;display:flex;flex-direction:column;gap:6px;flex:1\">\n                  <sc-for list=\"{{ b.itens }}\" as=\"it\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;gap:7px;align-items:flex-start;font-size:12px;color:#3C545B;line-height:1.4\"><span style=\"color:#3DAFC7;flex:none;margin-top:1px\">•<\u002Fspan><span>{{ it }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Layout lista (ferramentas sem modelo-padrão) -->\n        <sc-if value=\"{{ applyIsList }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"hg-g2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px\">\n            <sc-for list=\"{{ applyResultBlocos }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div style=\"border:1px solid #E0E8EA;border-radius:13px;overflow:hidden;display:flex;flex-direction:column\">\n                <div style=\"background:#EAF6F9;padding:11px 15px;border-bottom:1px solid #DCEDF1\"><span style=\"font-size:13px;font-weight:700;color:#1B6072;letter-spacing:0.02em;text-transform:uppercase\">{{ b.titulo }}<\u002Fspan><\u002Fdiv>\n                <div style=\"padding:13px 15px;display:flex;flex-direction:column;gap:8px;flex:1\">\n                  <sc-for list=\"{{ b.itens }}\" as=\"it\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:#3C545B;line-height:1.45\"><span style=\"color:#3DAFC7;flex:none;margin-top:1px\">●<\u002Fspan><span>{{ it }}<\u002Fspan><\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"position:sticky;bottom:0;background:#fff;border-top:1px solid #F0F4F5;padding:15px 26px;display:flex;align-items:center;gap:11px\">\n        <span style=\"flex:1;font-size:12.5px;color:#8AA0A7;line-height:1.4\">Gerado por IA a partir dos seus insumos — revise antes de usar no projeto.<\u002Fspan>\n        <button onclick=\"{{ regenApply }}\" style=\"border:1px solid #DCE7EB;background:#fff;color:#3C545B;font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer\" style-hover=\"border-color:#9FD7E2;color:#1E7C92\">Refazer<\u002Fbutton>\n        <button onclick=\"{{ exportApply }}\" style=\"display:flex;align-items:center;gap:7px;border:none;background:#3DAFC7;color:#fff;font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:10px;cursor:pointer\" style-hover=\"background:#2E9DB5\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 4v11m0 0l-4-4m4 4l4-4M5 20h14\" stroke=\"#fff\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Baixar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ CADASTRO ============ -->\n  <sc-if value=\"{{ isCadastro }}\" hint-placeholder-val=\"{{ false }}\">\n  <main class=\"hg-main\" style=\"max-width:880px;margin:0 auto;padding:34px 28px 90px\">\n    <div style=\"margin-bottom:8px\"><span style=\"font-size:12.5px;font-weight:600;color:#1E7C92;background:#EAF6F9;padding:5px 11px;border-radius:7px\">Painel do CIEP<\u002Fspan><\u002Fdiv>\n    <h1 style=\"font-size:30px;font-weight:700;color:#163B45;letter-spacing:-0.025em;margin-top:12px\">Cadastrar no Hangar<\u002Fh1>\n    <p style=\"font-size:15px;color:#7C9097;margin:6px 0 0;line-height:1.5;max-width:680px\">Adicione novas ferramentas, metodologias e escopos à biblioteca — manualmente ou com a IA. Você também pode cadastrar o <b style=\"color:#3C545B;font-weight:600\">modelo-padrão<\u002Fb> de uma ferramenta a partir de um anexo, para a IA seguir esse formato ao preencher.<\u002Fp>\n\n    <div style=\"display:inline-flex;background:#EEF3F5;border-radius:11px;padding:3px;gap:2px;margin:22px 0 0;flex-wrap:wrap\">\n      <button onclick=\"{{ setCadIA }}\" style=\"display:flex;align-items:center;gap:7px;border:none;background:{{ cadIaBg }};color:{{ cadIaColor }};font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;box-shadow:{{ cadIaShadow }}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Criar com IA<\u002Fbutton>\n      <button onclick=\"{{ setCadModelo }}\" style=\"display:flex;align-items:center;gap:7px;border:none;background:{{ cadModeloBg }};color:{{ cadModeloColor }};font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;box-shadow:{{ cadModeloShadow }}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"2.5\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Frect><path d=\"M3.5 9.5h17M10 9.5V21\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fpath><\u002Fsvg>Modelo-padrão de ferramenta<\u002Fbutton>\n      <button onclick=\"{{ setCadManual }}\" style=\"border:none;background:{{ cadManBg }};color:{{ cadManColor }};font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:8px;cursor:pointer;box-shadow:{{ cadManShadow }}\">Preencher manualmente<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- Criar ferramenta com IA -->\n    <sc-if value=\"{{ isCadIA }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:28px;margin-top:22px\">\n      <div style=\"display:flex;align-items:flex-start;gap:14px;margin-bottom:20px\">\n        <span style=\"flex:none;width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,#3DAFC7,#1B6072);display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"#fff\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div>\n          <h3 style=\"font-size:18px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">Criar ferramenta com IA<\u002Fh3>\n          <p style=\"font-size:14px;color:#7C9097;margin:4px 0 0;line-height:1.5;max-width:560px\">Cole anotações, transcrições, um material existente ou apenas descreva a ferramenta. A IA devolve a ferramenta já preenchida — descrição, objetivo, passo a passo, perguntas-chave e mais — pronta para revisar.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-bottom:16px\">\n        <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Nome da ferramenta <span style=\"color:#9DAEB4;font-weight:500\">(opcional)<\u002Fspan><\u002Flabel>\n        <input value=\"{{ aiToolNomeVal }}\" oninput=\"{{ setAiToolNome }}\" placeholder=\"Ex.: Matriz de Priorização GUT\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none\" style-focus=\"border-color:#9FD7E2\">\n      <\u002Fdiv>\n      <div>\n        <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Conteúdo de referência *<\u002Flabel>\n        <textarea value=\"{{ aiToolInputVal }}\" oninput=\"{{ setAiToolInput }}\" placeholder=\"Cole aqui o material, anotações ou uma descrição da ferramenta: o que é, para que serve, como aplica, quando usar…\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:13px;padding:13px 15px;font-size:14px;outline:none;resize:vertical;height:170px;line-height:1.6\" style-focus=\"border-color:#9FD7E2\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasAiToolError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;color:#B23B47;margin-top:10px;line-height:1.4\">{{ aiToolError }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;align-items:center;gap:12px;margin-top:18px;padding-top:18px;border-top:1px solid #F0F4F5\">\n        <div style=\"flex:1;font-size:13px;color:#8AA0A7;display:flex;align-items:center;gap:8px;line-height:1.4\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#B6C4C9\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M12 8.5v4M12 15.6h.01\" stroke=\"#B6C4C9\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>A ferramenta é criada em status \"Em revisão\" para o CIEP validar.<\u002Fdiv>\n        <button onclick=\"{{ generateTool }}\" disabled=\"{{ aiToolLoading }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;border:none;background:#3DAFC7;color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:11px;cursor:pointer\" style-hover=\"background:#2E9DB5\">\n          <sc-if value=\"{{ aiToolLoading }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"width:15px;height:15px;border:2px solid rgba(255,255,255,0.45);border-top-color:#fff;border-radius:50%;display:inline-block;animation:ciepSpin .7s linear infinite\"><\u002Fspan>Gerando ferramenta…\n          <\u002Fsc-if>\n          <sc-if value=\"{{ aiToolNotLoading }}\" hint-placeholder-val=\"{{ true }}\">\n            <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Gerar ferramenta com IA\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Cadastrar modelo-padrão de ferramenta -->\n    <sc-if value=\"{{ isCadModelo }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:28px;margin-top:22px\">\n      <div style=\"display:flex;align-items:flex-start;gap:14px;margin-bottom:22px\">\n        <span style=\"flex:none;width:46px;height:46px;border-radius:12px;background:linear-gradient(150deg,#3DAFC7,#1B6072);display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\"><rect x=\"3.5\" y=\"3.5\" width=\"17\" height=\"17\" rx=\"2.5\" stroke=\"#fff\" stroke-width=\"1.6\"><\u002Frect><path d=\"M3.5 9.5h17M10 9.5V21\" stroke=\"#fff\" stroke-width=\"1.6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div>\n          <h3 style=\"font-size:18px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">Cadastrar modelo-padrão de ferramenta<\u002Fh3>\n          <p style=\"font-size:14px;color:#7C9097;margin:4px 0 0;line-height:1.5;max-width:580px\">Anexe a imagem ou o PDF do modelo de uma ferramenta (ex.: o Business Model Canvas). A IA lê o anexo, extrai o formato — os blocos e o layout — e registra como padrão. A partir daí, ao preencher essa ferramenta com IA, o resultado segue exatamente esse formato.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hg-cols\" style=\"display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start\">\n        <!-- Dropzone -->\n        <div>\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Anexo do modelo *<\u002Flabel>\n          <sc-if value=\"{{ hasModeloFile }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;gap:13px;border:1.5px solid #C6E4EC;border-radius:13px;padding:16px 18px;background:#F4FBFC\">\n              <span style=\"flex:none;width:42px;height:42px;border-radius:10px;background:#EAF6F9;color:#1E7C92;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M14 3v5h5M7 3h7l5 5v11a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z\" stroke=\"#1E7C92\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-size:14px;font-weight:600;color:#163B45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ modeloFileName }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#1E7C92;margin-top:2px\">Pronto para a IA ler<\u002Fdiv>\n              <\u002Fdiv>\n              <button onclick=\"{{ clearModeloFile }}\" style=\"flex:none;border:none;background:#E7F1F4;width:32px;height:32px;border-radius:8px;cursor:pointer;color:#7C9097;font-size:16px\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noModeloFile }}\" hint-placeholder-val=\"{{ true }}\">\n          <label style=\"display:flex;flex-direction:column;align-items:center;border:1.5px dashed #C9DBE0;border-radius:13px;padding:30px;text-align:center;background:#FAFCFC;cursor:pointer\" style-hover=\"border-color:#9FD7E2;background:#F4FBFC\">\n            <input type=\"file\" accept=\"image/*,application/pdf,.pdf\" onchange=\"{{ onModeloFile }}\" style=\"display:none\">\n            <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 16V4m0 0l-4 4m4-4l4 4M5 20h14\" stroke=\"#7FBFD0\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:14px;font-weight:600;color:#3C545B;margin-top:10px\">Arraste ou clique para anexar o modelo<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#9DAEB4;margin-top:3px\">Imagem (PNG, JPG) ou PDF do quadro/template da ferramenta<\u002Fdiv>\n          <\u002Flabel>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasModeloError }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;color:#B23B47;margin-top:10px;line-height:1.4\">{{ modeloError }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <!-- Nome + ação -->\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div>\n            <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Ferramenta <span style=\"color:#9DAEB4;font-weight:500\">(opcional)<\u002Fspan><\u002Flabel>\n            <input value=\"{{ modeloNomeVal }}\" oninput=\"{{ setModeloNome }}\" placeholder=\"Ex.: Business Model Canvas\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14px;outline:none\" style-focus=\"border-color:#9FD7E2\">\n          <\u002Fdiv>\n          <button onclick=\"{{ readModelo }}\" disabled=\"{{ modeloLoading }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;border:none;background:#3DAFC7;color:#fff;font-size:14px;font-weight:600;padding:12px;border-radius:11px;cursor:pointer\" style-hover=\"background:#2E9DB5\">\n            <sc-if value=\"{{ modeloLoading }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"width:15px;height:15px;border:2px solid rgba(255,255,255,0.45);border-top-color:#fff;border-radius:50%;display:inline-block;animation:ciepSpin .7s linear infinite\"><\u002Fspan>Lendo modelo…\n            <\u002Fsc-if>\n            <sc-if value=\"{{ modeloNotLoading }}\" hint-placeholder-val=\"{{ true }}\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3l1.9 4.6L18.5 9l-3.4 3 1 4.7L12 14.4 7.9 16.7l1-4.7L5.5 9l4.6-1.4L12 3z\" stroke=\"#fff\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Ler e registrar com IA\n            <\u002Fsc-if>\n          <\u002Fbutton>\n          <div style=\"font-size:12px;color:#8AA0A7;line-height:1.45;display:flex;gap:7px\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none;margin-top:1px\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#B6C4C9\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M12 8.5v4M12 15.6h.01\" stroke=\"#B6C4C9\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><span>A IA detecta os blocos e o layout do modelo automaticamente.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Modelos registrados -->\n    <div style=\"margin-top:26px\">\n      <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:14px\">\n        <h3 style=\"font-size:17px;font-weight:700;color:#163B45;font-family:'Schibsted Grotesk'\">Modelos-padrão registrados<\u002Fh3>\n        <span style=\"font-size:13px;color:#9DAEB4\">{{ docDate }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ modelosList }}\" as=\"m\" hint-placeholder-count=\"1\">\n          <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px 22px\">\n            <div style=\"display:flex;align-items:flex-start;gap:13px;margin-bottom:16px\">\n              <span style=\"flex:none;width:42px;height:42px;border-radius:11px;background:#EAF6F9;color:#1E7C92;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:14px\">{{ m.sigla }}<\u002Fspan>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                  <h4 style=\"font-size:16px;font-weight:600;color:#163B45\">{{ m.nome }}<\u002Fh4>\n                  <span style=\"font-size:11px;font-weight:600;color:#1E7C92;background:#EAF6F9;padding:2px 8px;border-radius:6px\">{{ m.layoutLabel }}<\u002Fspan>\n                  <span style=\"font-size:11px;font-weight:600;color:#6A5FB0;background:#EFEDFB;padding:2px 8px;border-radius:6px\">{{ m.vinculo }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8AA0A7;margin-top:3px\">{{ m.blocoCount }} blocos · {{ m.registrado }} de <b style=\"color:#5E747B;font-weight:600\">{{ m.fonte }}<\u002Fb><\u002Fdiv>\n              <\u002Fdiv>\n              <button onclick=\"{{ m.remove }}\" style=\"flex:none;border:1px solid #EEDDDE;background:#fff;color:#C2787F;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer\" style-hover=\"background:#FCF3F4\">Remover<\u002Fbutton>\n            <\u002Fdiv>\n            <!-- Preview canvas -->\n            <sc-if value=\"{{ m.isCanvas }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:46px;gap:6px\">\n                <sc-for list=\"{{ m.blocos }}\" as=\"b\" hint-placeholder-count=\"9\">\n                  <div style=\"grid-column:{{ b.gc }};grid-row:{{ b.gr }};background:#F6F9FA;border:1px solid #E7EEF1;border-radius:8px;padding:6px 8px;display:flex;align-items:center\">\n                    <span style=\"font-size:11px;font-weight:600;color:#3C545B;line-height:1.2\">{{ b.titulo }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <!-- Preview grade -->\n            <sc-if value=\"{{ m.isCanvas }}\" hint-placeholder-val=\"{{ false }}\">\n            <\u002Fsc-if>\n            <sc-if value=\"{{ m.isGrid }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:7px\">\n                <sc-for list=\"{{ m.chips }}\" as=\"c\" hint-placeholder-count=\"5\">\n                  <span style=\"font-size:12.5px;color:#3C545B;background:#F6F9FA;border:1px solid #E7EEF1;padding:5px 11px;border-radius:8px\">{{ c }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Cadastro manual -->\n    <sc-if value=\"{{ isCadManual }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;gap:8px;margin:26px 0 24px\">\n      <sc-for list=\"{{ formSteps }}\" as=\"fs\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex;align-items:center;gap:8px;flex:1\">\n          <span style=\"width:26px;height:26px;border-radius:50%;background:{{ fs.bg }};color:{{ fs.color }};font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none\">{{ fs.n }}<\u002Fspan>\n          <span style=\"font-size:13.5px;font-weight:600;color:{{ fs.labelColor }}\">{{ fs.label }}<\u002Fspan>\n          <span style=\"flex:1;height:1.5px;background:#E7EEF1\"><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:22px\">\n      <div class=\"hg-g2\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px\">\n        <div style=\"grid-column:span 2\">\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Nome do conteúdo *<\u002Flabel>\n          <input value=\"{{ form.nome }}\" oninput=\"{{ formNome }}\" placeholder=\"Ex.: Matriz de Priorização GUT\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none\" style-focus=\"border-color:#9FD7E2\">\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Tipo *<\u002Flabel>\n          <select value=\"{{ form.tipo }}\" onchange=\"{{ formTipo }}\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\">\n            <sc-for list=\"{{ tipoOptions }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.value }}\">{{ o.value }}<\u002Foption><\u002Fsc-for>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Categoria (grupo do Hangar) *<\u002Flabel>\n          <select value=\"{{ form.categoria }}\" onchange=\"{{ formCategoria }}\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;background:#fff;color:#172A30\" style-focus=\"border-color:#9FD7E2\">\n            <sc-for list=\"{{ categoriaOptions }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.value }}\">{{ o.value }}<\u002Foption><\u002Fsc-for>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div style=\"grid-column:span 2\">\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Descrição curta *<\u002Flabel>\n          <input value=\"{{ form.descricao }}\" oninput=\"{{ formDescricao }}\" placeholder=\"Uma frase que resume o que é e para que serve\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none\" style-focus=\"border-color:#9FD7E2\">\n        <\u002Fdiv>\n        <div style=\"grid-column:span 2\">\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Objetivo *<\u002Flabel>\n          <textarea value=\"{{ form.objetivo }}\" oninput=\"{{ formObjetivo }}\" placeholder=\"O que essa ferramenta entrega ao final da aplicação?\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;resize:none;height:74px\" style-focus=\"border-color:#9FD7E2\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"grid-column:span 2\">\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Problema que resolve *<\u002Flabel>\n          <textarea value=\"{{ form.problema }}\" oninput=\"{{ formProblema }}\" placeholder=\"Qual dor do projeto essa ferramenta endereça?\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none;resize:none;height:74px\" style-focus=\"border-color:#9FD7E2\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Nível de complexidade *<\u002Flabel>\n          <div style=\"display:flex;gap:8px\">\n            <sc-for list=\"{{ complexOptions }}\" as=\"co\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ co.set }}\" style=\"flex:1;border:1.5px solid {{ co.border }};background:{{ co.bg }};color:{{ co.color }};font-size:13.5px;font-weight:600;padding:10px;border-radius:10px;cursor:pointer\">{{ co.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Tempo estimado *<\u002Flabel>\n          <input value=\"{{ form.tempo }}\" oninput=\"{{ formTempo }}\" placeholder=\"Ex.: 1–2h\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none\" style-focus=\"border-color:#9FD7E2\">\n        <\u002Fdiv>\n        <div>\n          <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Responsável *<\u002Flabel>\n          <input value=\"{{ form.responsavel }}\" oninput=\"{{ formResp }}\" placeholder=\"Ex.: Núcleo CIEP\" style=\"width:100%;border:1.5px solid #DCE7EB;border-radius:11px;padding:11px 14px;font-size:14.5px;outline:none\" style-focus=\"border-color:#9FD7E2\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Anexos uploader -->\n      <div>\n        <label style=\"display:block;font-size:13px;font-weight:600;color:#3C545B;margin-bottom:7px\">Anexos e templates<\u002Flabel>\n        <div style=\"border:1.5px dashed #C9DBE0;border-radius:13px;padding:26px;text-align:center;background:#FAFCFC\">\n          <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"margin:0 auto\"><path d=\"M12 16V4m0 0l-4 4m4-4l4 4M5 20h14\" stroke=\"#7FBFD0\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          <div style=\"font-size:14px;font-weight:600;color:#3C545B;margin-top:10px\">Arraste arquivos ou clique para enviar<\u002Fdiv>\n          <div style=\"font-size:12.5px;color:#9DAEB4;margin-top:3px\">Templates, PDFs, planilhas, apresentações, exemplos preenchidos<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:center;gap:12px;padding-top:6px;border-top:1px solid #F0F4F5\">\n        <div style=\"flex:1;font-size:13px;color:#8AA0A7;display:flex;align-items:center;gap:8px\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#B6C4C9\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M12 8.5v4M12 15.6h.01\" stroke=\"#B6C4C9\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>A página completa, o card e a ficha são gerados automaticamente.<\u002Fdiv>\n        <button style=\"border:1px solid #DCE7EB;background:#fff;color:#5E747B;font-size:14px;font-weight:600;padding:11px 18px;border-radius:11px;cursor:pointer\">Salvar rascunho<\u002Fbutton>\n        <button onclick=\"{{ publish }}\" style=\"border:none;background:#3DAFC7;color:#fff;font-size:14px;font-weight:600;padding:11px 22px;border-radius:11px;cursor:pointer\" style-hover=\"background:#2E9DB5\">Publicar conteúdo<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ ESCOPOS ============ -->\n  <sc-if value=\"{{ isEscopos }}\" hint-placeholder-val=\"{{ false }}\">\n  <main class=\"hg-main\" style=\"max-width:1200px;margin:0 auto;padding:34px 28px 80px\">\n\n    <sc-if value=\"{{ noEscopoSel }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-bottom:8px\">\n        <h1 style=\"font-size:30px;font-weight:700;color:#163B45;letter-spacing:-0.025em\">Escopos<\u002Fh1>\n        <p style=\"font-size:15px;color:#7C9097;margin:6px 0 0;max-width:720px;line-height:1.5\">As linhas de serviço da Produtiva Júnior. Cada escopo tem suas etapas em sequência, e as ferramentas aparecem dentro da etapa em que são usadas — do jeito que o projeto acontece.<\u002Fp>\n      <\u002Fdiv>\n      <sc-if value=\"{{ semEscopos }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:28px;background:#fff;border:1px dashed #C9DBE0;border-radius:16px;padding:32px;text-align:center;color:#8AA0A7;font-size:14.5px\">Nenhum escopo cadastrado ainda. O rascunho é gerado a partir do Resumão dos escopos — veja <b>fontes/README.md<\u002Fb>.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ escoposPorGrupo }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div style=\"margin-top:34px\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:16px\">\n            <span style=\"width:10px;height:10px;border-radius:3px;background:{{ g.cor }}\"><\u002Fspan>\n            <h2 style=\"font-size:19px;font-weight:700;color:#163B45;letter-spacing:-0.01em\">{{ g.label }}<\u002Fh2>\n          <\u002Fdiv>\n          <div class=\"hg-g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n            <sc-for list=\"{{ g.escopos }}\" as=\"e\" hint-placeholder-count=\"3\">\n              <article onclick=\"{{ e.pick }}\" style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px\" style-hover=\"border-color:#C6E4EC;box-shadow:0 12px 30px -18px rgba(22,59,69,0.25)\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between\">\n                  <span style=\"font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px;background:{{ e.grupoBg }};color:{{ e.grupoCor }}\">{{ e.grupoLabel }}<\u002Fspan>\n                  <sc-if value=\"{{ e.despriorizado }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11.5px;font-weight:600;color:#9DAEB4;background:#F2F6F7;padding:3px 9px;border-radius:6px\">Despriorizado<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <div>\n                  <h3 style=\"font-size:17.5px;font-weight:600;color:#163B45;line-height:1.25\">{{ e.nome }}<\u002Fh3>\n                  <p style=\"font-size:13.5px;color:#5E747B;margin:6px 0 0;line-height:1.5\">{{ e.descricao }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8AA0A7;margin-top:auto;padding-top:4px\">{{ e.resumo }}<\u002Fdiv>\n              <\u002Farticle>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasEscopoSel }}\" hint-placeholder-val=\"{{ false }}\">\n      <button onclick=\"{{ goEscopos }}\" style=\"display:flex;align-items:center;gap:7px;border:none;background:transparent;color:#1E7C92;font-size:14px;font-weight:600;cursor:pointer;padding:8px 0;margin-bottom:8px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M15 6l-6 6 6 6\" stroke=\"#1E7C92\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>Todos os escopos<\u002Fbutton>\n\n      <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:18px;padding:28px;margin-bottom:22px\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px\">\n          <span style=\"font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:7px;background:{{ escopoSel.grupoBg }};color:{{ escopoSel.grupoCor }}\">{{ escopoSel.grupoLabel }}<\u002Fspan>\n          <span style=\"font-size:12.5px;color:#5E747B;background:#EFF4F5;padding:5px 11px;border-radius:7px\">{{ escopoSel.statusLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"font-size:32px;font-weight:700;color:#163B45;letter-spacing:-0.025em;line-height:1.12\">{{ escopoSel.nome }}<\u002Fh1>\n        <p style=\"font-size:16.5px;color:#5E747B;margin:12px 0 0;line-height:1.55;max-width:720px\">{{ escopoSel.descricao }}<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:18px;margin-top:20px;padding-top:18px;border-top:1px solid #F0F4F5\">\n          <div><div style=\"font-size:11px;font-weight:700;color:#9DAEB4;letter-spacing:0.04em;text-transform:uppercase\">Etapas<\u002Fdiv><div style=\"font-size:14.5px;font-weight:600;color:#163B45;margin-top:3px\">{{ escopoSel.nEtapas }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:11px;font-weight:700;color:#9DAEB4;letter-spacing:0.04em;text-transform:uppercase\">Ferramentas mapeadas<\u002Fdiv><div style=\"font-size:14.5px;font-weight:600;color:#163B45;margin-top:3px\">{{ escopoSel.nFerr }}<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:11px;font-weight:700;color:#9DAEB4;letter-spacing:0.04em;text-transform:uppercase\">Responsável<\u002Fdiv><div style=\"font-size:14.5px;font-weight:600;color:#163B45;margin-top:3px\">{{ escopoSel.respNome }}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ escopoSel.hasCases }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-bottom:22px\">\n        <div style=\"font-size:12px;font-weight:700;color:#9DAEB4;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:12px\">Cases deste escopo<\u002Fdiv>\n        <div class=\"hg-g3\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px\">\n          <sc-for list=\"{{ escopoSel.cases }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <article onclick=\"{{ c.open }}\" style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:12px\" style-hover=\"border-color:#C6E4EC;box-shadow:0 12px 30px -18px rgba(22,59,69,0.25)\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                  <span style=\"font-size:12px;font-weight:600;padding:4px 10px;border-radius:7px;background:{{ c.escopoBg }};color:{{ c.escopoCor }}\">{{ c.escopoNome }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#9DAEB4;white-space:nowrap\">{{ c.periodoFmt }}<\u002Fspan>\n                <\u002Fdiv>\n                <div>\n                  <h3 style=\"font-size:18px;font-weight:600;color:#163B45;letter-spacing:-0.01em;line-height:1.25\">{{ c.cliente }}<\u002Fh3>\n                  <p style=\"font-size:13px;color:#7C9097;margin:3px 0 0\">{{ c.segmento }} · {{ c.cidade }}<\u002Fp>\n                  <p style=\"font-size:13.5px;color:#3C545B;margin:8px 0 0;line-height:1.5\">{{ c.resultadoDestaque }}<\u002Fp>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px;gap:8px\">\n                  <span style=\"font-size:12.5px;color:#5E747B;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.equipeResumo }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#9DAEB4;white-space:nowrap\">{{ c.nDocs }} docs<sc-if value=\"{{ c.hasVideo }}\" hint-placeholder-val=\"{{ false }}\"> · ▶ vídeo<\u002Fsc-if><\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ c.local }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:11.5px;font-weight:600;color:#9A6B17;background:#FBF1E0;padding:3px 9px;border-radius:6px;align-self:flex-start\">Só neste navegador · envie ao CIEP<\u002Fspan><\u002Fsc-if>\n              <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- Linha do tempo das etapas -->\n      <sc-for list=\"{{ escopoEtapas }}\" as=\"et\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center\">\n            <span style=\"width:40px;height:40px;border-radius:50%;background:#163B45;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:14px;flex:none\">{{ et.num }}<\u002Fspan>\n            <span style=\"flex:1;width:2px;background:{{ et.linhaBg }};margin:6px 0\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:20px 22px;margin-bottom:14px\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n              <h3 style=\"font-size:17px;font-weight:600;color:#163B45;font-family:'Schibsted Grotesk'\">{{ et.nome }}<\u002Fh3>\n              <sc-if value=\"{{ et.hasDuracao }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px;color:#8AA0A7;background:#EFF4F5;padding:3px 9px;border-radius:6px\">{{ et.duracaoRef }}<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <sc-if value=\"{{ et.hasEntregaveis }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:10px\">\n                <span style=\"font-size:11px;font-weight:700;color:#9DAEB4;letter-spacing:0.04em;text-transform:uppercase;align-self:center\">Entregáveis<\u002Fspan>\n                <sc-for list=\"{{ et.entregaveis }}\" as=\"en\" hint-placeholder-count=\"2\"><span style=\"font-size:12.5px;color:#2E7D52;background:#E7F4EC;padding:3px 9px;border-radius:6px\">{{ en }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ et.hasFerramentas }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px\">\n                <sc-for list=\"{{ et.ferramentas }}\" as=\"item\" hint-placeholder-count=\"2\">\n                  <div onclick=\"{{ item.open }}\" style=\"display:flex;align-items:center;gap:13px;padding:11px 14px;border:1px solid #EEF3F5;border-radius:11px;cursor:pointer\" style-hover=\"border-color:#C6E4EC;background:#FAFCFC\">\n                    <div style=\"flex:none;width:36px;height:36px;border-radius:9px;background:{{ item.tipoBg }};color:{{ item.tipoColor }};display:flex;align-items:center;justify-content:center;font-family:'Schibsted Grotesk';font-weight:700;font-size:15px\">{{ item.initial }}<\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><span style=\"font-size:14.5px;font-weight:600;color:#163B45\">{{ item.nome }}<\u002Fspan><span style=\"font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;background:{{ item.tipoBg }};color:{{ item.tipoColor }}\">{{ item.tipo }}<\u002Fspan><\u002Fdiv>\n                      <p class=\"hg-clamp2\" style=\"font-size:13px;color:#7C9097;margin:2px 0 0;line-height:1.45\">{{ item.descricao }}<\u002Fp>\n                    <\u002Fdiv>\n                    <span class=\"hg-hide-m\" style=\"flex:none;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;background:{{ item.complexBg }};color:{{ item.complexColor }}\">{{ item.complexidade }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ et.semFerramentas }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:13.5px;color:#8AA0A7;margin:12px 0 0\">Ferramentas desta etapa ainda não mapeadas no Cronograma Base.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ CASES (lista) ============ -->\n  <sc-if value=\"{{ isCases }}\" hint-placeholder-val=\"{{ false }}\">\n  <main class=\"hg-main\" style=\"max-width:1200px;margin:0 auto;padding:34px 28px 80px\">\n    <div class=\"hg-stack\" style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap\">\n      <div>\n        <h1 style=\"font-size:30px;font-weight:700;color:#163B45;letter-spacing:-0.025em\">Banco de cases<\u002Fh1>\n        <p style=\"font-size:15px;color:#7C9097;margin:6px 0 0;max-width:640px;line-height:1.5\">Projetos finalizados da Produtiva, contados por quem fez. Procure por cliente, segmento, escopo, ferramenta ou resultado.<\u002Fp>\n      <\u002Fdiv>\n      <button onclick=\"{{ goNovoCase }}\" style=\"display:flex;align-items:center;gap:8px;border:none;background:#3DAFC7;color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:11px;cursor:pointer\" style-hover=\"background:#2E9DB5\">+ Cadastrar case<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ semCases }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:1px dashed #C9DBE0;border-radius:16px;padding:40px;text-align:center\">\n        <div style=\"font-size:17px;font-weight:600;color:#3C545B\">Nenhum case ainda.<\u002Fdiv>\n        <p style=\"font-size:14px;color:#8AA0A7;margin:8px auto 18px;max-width:520px;line-height:1.5\">Fechou um projeto que deu certo? Registre cliente, escopo, equipe, resultados, documentos e o vídeo da equipe. Leva uns 15 minutos.<\u002Fp>\n        <button onclick=\"{{ goNovoCase }}\" style=\"border:none;background:#3DAFC7;color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:11px;cursor:pointer\" style-hover=\"background:#2E9DB5\">Cadastrar o primeiro case<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasCasesRecentes }}\" hint-placeholder-val=\"{{ false }}\">\n    <button class=\"hg-only-m\" onclick=\"{{ toggleFiltros }}\" style=\"align-items:center;justify-content:center;gap:8px;width:100%;margin-bottom:12px;border:1px solid #DCE7EB;background:#fff;color:#1E7C92;font-size:14px;font-weight:600;padding:10px;border-radius:11px;cursor:pointer\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M4 6h16M7 12h10M10 18h4\" stroke=\"#1E7C92\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>{{ filtrosLabel }}<\u002Fbutton>\n    <div class=\"hg-cols\" style=\"display:grid;grid-template-columns:248px 1fr;gap:28px;align-items:start\">\n      <aside class=\"hg-aside hg-filtros {{ filtrosClass }} ciep-scroll\" style=\"position:sticky;top:88px;background:#fff;border:1px solid #E7EEF1;border-radius:16px;padding:6px 4px;max-height:calc(100vh - 110px);overflow:auto\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px\">\n          <span style=\"font-size:14px;font-weight:700;color:#163B45\">Filtros<\u002Fspan>\n          <button onclick=\"{{ clearCaseFilters }}\" style=\"border:none;background:transparent;color:#1E7C92;font-size:12.5px;font-weight:600;cursor:pointer\">Limpar<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-for list=\"{{ caseFilterGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <div style=\"padding:10px 16px;border-top:1px solid #F0F4F5\">\n            <div style=\"font-size:12px;font-weight:700;color:#9DAEB4;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:9px\">{{ g.label }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <sc-for list=\"{{ g.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                <label onclick=\"{{ opt.toggle }}\" style=\"display:flex;align-items:center;gap:9px;cursor:pointer;padding:5px 4px;border-radius:7px\" style-hover=\"background:#F6F9FA\">\n                  <sc-if value=\"{{ opt.active }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:17px;height:17px;border-radius:5px;background:#3DAFC7;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12l4.5 4.5L19 7\" stroke=\"#fff\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{ opt.inactive }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:17px;height:17px;border-radius:5px;border:1.6px solid #D4E0E4;flex:none\"><\u002Fspan><\u002Fsc-if>\n                  <span style=\"flex:1;font-size:13.5px;color:#3C545B\">{{ opt.label }}<\u002Fspan>\n                  <span style=\"font-size:12px;color:#B6C4C9;font-weight:500\">{{ opt.count }}<\u002Fspan>\n                <\u002Flabel>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Faside>\n\n      <div>\n        <div style=\"display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #DCE7EB;border-radius:11px;padding:9px 14px;margin-bottom:14px\">\n          <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" style=\"flex:none\"><circle cx=\"11\" cy=\"11\" r=\"7\" stroke=\"#9DAEB4\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M20 20l-3.2-3.2\" stroke=\"#9DAEB4\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <input value=\"{{ caseQuery }}\" oninput=\"{{ onCaseQuery }}\" placeholder=\"Cliente, segmento, escopo, ferramenta, resultado, consultor…\" style=\"flex:1;border:none;outline:none;font-size:14.5px;background:transparent\">\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px\">\n          <span style=\"font-size:13.5px;color:#7C9097\"><b style=\"color:#163B45\">{{ casesCount }}<\u002Fb> cases<\u002Fspan>\n          <sc-if value=\"{{ hasCaseFilters }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n              <sc-for list=\"{{ caseActiveChips }}\" as=\"ch\" hint-placeholder-count=\"2\">\n                <button onclick=\"{{ ch.remove }}\" style=\"display:flex;align-items:center;gap:6px;border:none;background:#EAF6F9;color:#1E7C92;font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;cursor:pointer\">{{ ch.label }} <span style=\"font-size:14px;line-height:1\">×<\u002Fspan><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px 18px\">\n          <sc-for list=\"{{ casesList }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <article onclick=\"{{ c.open }}\" style=\"cursor:pointer;display:flex;flex-direction:column;gap:11px;transition:transform .15s ease\" style-hover=\"transform:translateY(-3px)\">\n              <div style=\"position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#EEF3F5;border:1px solid #E7EEF1;box-shadow:0 10px 26px -18px rgba(22,59,69,0.35)\">\n                <sc-if value=\"{{ c.hasFoto }}\" hint-placeholder-val=\"{{ false }}\"><img sc-camel-src=\"{{ c.fotoSrc }}\" alt=\"{{ c.cliente }}\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fsc-if>\n                <sc-if value=\"{{ c.semFoto }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:{{ c.placeholderBg }}\"><span style=\"font-family:'Schibsted Grotesk';font-size:46px;font-weight:700;letter-spacing:-0.02em;color:{{ c.escopoCor }};opacity:0.7\">{{ c.inicial }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n                <span style=\"position:absolute;top:10px;left:10px;max-width:calc(100% - 84px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;background:{{ c.escopoBg }};color:{{ c.escopoCor }};box-shadow:0 1px 4px rgba(0,0,0,0.08)\">{{ c.escopoNome }}<\u002Fspan>\n                <sc-if value=\"{{ c.local }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;color:#9A6B17;background:#FBF1E0;padding:4px 8px;border-radius:6px\" title=\"Só neste navegador · envie ao CIEP\">Só aqui<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ c.hasVideo }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"position:absolute;right:10px;bottom:10px;background:rgba(14,26,30,0.72);color:#fff;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px\">▶ vídeo<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n              <div style=\"padding:0 4px\">\n                <h3 style=\"font-size:16.5px;font-weight:600;color:#163B45;letter-spacing:-0.01em;line-height:1.25\">{{ c.cliente }}<\u002Fh3>\n                <p style=\"font-size:13px;color:#7C9097;margin:3px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.segmento }} · {{ c.periodoFmt }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ semResultadoCases }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"text-align:center;padding:60px 20px;color:#8AA0A7\"><div style=\"font-size:17px;font-weight:600;color:#5E747B\">Nenhum case encontrado<\u002Fdiv><p style=\"font-size:14px;margin:8px 0 0\">Tente outra palavra ou limpe os filtros.<\u002Fp><\u002Fdiv>\n        <\u002Fsc-if>\n
